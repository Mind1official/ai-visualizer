<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Portrait</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#070405;overflow:hidden}
  canvas#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  body{font:12px/1.5 'SF Mono',Menlo,Consolas,monospace;color:rgb(255,190,205)}
</style>
<!-- The panels around the face -- activity strip, transcript, gauges --
     are the FACE's job, not core.js's, so a new face starts blank. These
     are shared with any future face rather than copied into each one. -->
<link rel="stylesheet" href="../_shared/hud.css">
<style>
  /* MUSIC MODE: the chat and the gauges step aside so the corona has the
     screen. Faded rather than removed, so the layout -- and therefore the
     face's centre, which is fitted between the panels -- holds still.
     After the HUD stylesheet on purpose: it loads last and would
     otherwise win. */
  #transcript-panel,#usage-gauge,#context-gauge{transition:opacity 1s ease}
  body.music #transcript-panel,body.music #usage-gauge,
  body.music #context-gauge{opacity:0!important;pointer-events:none!important;
    transition:opacity 1s ease!important}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="activity-panel" class="hud-panel"></div>
<div id="transcript-panel" class="hud-panel"></div>
<div id="context-gauge"></div>
<div id="usage-gauge"></div>
<div id="health-gauge"></div>
<script src="../../core.js"></script>
<script>
/* THE MASK — a face made of a point grid.
 *
 * Mind handed over a screenshot of a blue dot-matrix face and asked:
 * "Is that something you can create for your own face?" Then: "Let's go
 * second mode for now. I want to see what it looks like."
 *
 * HOW IT WORKS, because the trick is smaller than it looks. There is no
 * 3D model and no mesh. There is a flat grid of dots and a HEIGHT FIELD
 * -- a function h(x, y) that says how far forward the face sticks out at
 * that point. Every dot then does four things with its height:
 *
 *   * moves outward from centre, which is what fakes the perspective;
 *   * grows, because near things are bigger;
 *   * brightens, because near things catch the light;
 *   * throws a SPIKE where the surface is steep, which is what gives the
 *     reference image its bristled silhouette. Steepness is just the
 *     gradient of h, and the spike points along it.
 *
 * THE HEIGHT FIELD IS WRITTEN BY HAND, not sampled from a photo or a
 * model file. A dome for the skull, gaussians subtracted for the eye
 * sockets, a ridge for the nose, a lens for the mouth. That is a real
 * trade: a scanned head would be anatomically right, but it would be an
 * asset to ship, to license and to load, and this file would then be a
 * renderer for a thing it does not contain. Hand-built, the face is
 * fifty lines of arithmetic that can be tuned in place -- and when it
 * looks wrong, the wrongness is in a number somebody can read.
 *
 * IT IS DELIBERATELY NOT A PORTRAIT. Dots, gaps, no skin. A face that
 * nearly resolves into a person lands in the uncanny valley; one that is
 * visibly made of data does not, and that is the honest thing to be.
 *
 * WHAT IT DOES WITH THE VOICE (core.js supplies all of it):
 *   idle       slow breath, dots drifting on their own
 *   listening  a ripple runs outward from the grid, mic-driven
 *   thinking   the grid scatters and reknits, face held back
 *   speaking   the face surges forward, spikes extend on every syllable
 */

// AV is core.js's own global -- redeclaring it here is a syntax error
// that blanks the face.
const cvs = document.getElementById("stage");
const ctx = cvs.getContext("2d", { alpha: false });

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cvs.width = W * DPR; cvs.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  build();
}
addEventListener("resize", resize);

/* ---------------------------- the height field --------------------------- */
/* Coordinates are face-local: x in [-1, 1] across, y in [-1, 1] down, with
 * (0, 0) between the eyes. h returns roughly 0..1, where 1 is the tip of
 * the nose. Everything below is tuned by eye; the comments say what each
 * term is FOR so the next person can tune it too. */

const gauss = (d2, s) => Math.exp(-d2 / (2 * s * s));

/* ------------------------- the face, from a photo -------------------------
 * THE SOURCE IS A PICTURE, NOT ARITHMETIC. The first Mask hand-built a
 * skull out of gaussians -- a dome, subtracted eye sockets, a nose ridge.
 * It worked, and it never stopped reading as an egg with dimples, because
 * every feature that makes a face legible (the shadow under a brow, the
 * turn of a cheekbone, the edge of a lip) is a LIGHTING fact, and a
 * height field only knows distance. Fighting that with a lambert light
 * failed three ways on 2026-10-14 before Mind handed over the reference
 * he actually wanted: a dotted portrait. That image is a photograph
 * sampled by dots. A painter did the shading; the dots only carry it.
 *
 * So: sample a portrait's luminance per dot and use it exactly where the
 * old field used height -- displacement, size, brightness, spikes. The
 * rig above it (the mouth, the jaw, the states) is unchanged.
 *
 * Swap `source.jpg` for any portrait. It wants: head filling the frame,
 * strong side light, dark background. */

const SRC = "source.png";
// How much of the image the face coordinates cover. x spans -0.75..0.75,
// y spans -1..1, so these are the numbers that frame the head.
// HOW BIG THE HEAD SITS ON SCREEN. Only the width is a choice -- the
// height follows the picture's own aspect once it has loaded, because
// picking both by hand stretches whatever portrait gets dropped in next.
const FACE_W = 3.00;
let FACE_H = 1.44;
// Where the mouth lands as a fraction down the image, converted into the
// same face coordinates the rig uses. MEASURE THIS when swapping the
// picture -- the jaw hinges on it.
const MOUTH_FRAC = 0.617;
let MOUTH_Y = (MOUTH_FRAC - 0.5) * FACE_H;
// WHERE THE CHIN ENDS, as a fraction down the same image. MEASURE THIS
// when swapping the picture, with the mouth: the jaw swings between the
// two and must stop here. Leaving it out was the original bug -- the jaw
// weight ramped downward with no bottom to it, so the NECK AND SHOULDERS
// swung harder than the chin did, and every sentence rocked her whole
// torso while the lower lip split off on its own (Mind, 2026-10-15:
// "it just splits your bottom lip and moves your neck and shoulders").
// Measured off a 10% grid drawn over source.png: the jawline lands at
// 0.70, the collarbones at 0.88.
const CHIN_FRAC = 0.70;
let CHIN_Y = (CHIN_FRAC - 0.5) * FACE_H;
// WHERE THE EYES ARE. MEASURE THESE AGAIN when the picture changes --
// the blink hinges on them the way the jaw hinges on MOUTH_Y.
//
// And measure them the SLOW way: find the pupils by eye on the picture
// and check the numbers by drawing circles back onto it. The quick
// version -- "take the darkest band across the upper half" -- put them
// on the eyelids, because lashes and a strong brow are darker than an
// iris. Mind caught it on the live face in one glance ("off a touch").
const EYE_FRAC = 0.387, EYE_CFRAC = 0.500, EYE_SEP = 0.113;
let EYE_Y = (EYE_FRAC - 0.5) * FACE_H;
const EYE_CX = (EYE_CFRAC - 0.5) * FACE_W, EYE_DX = EYE_SEP * FACE_W;

let IMG = null, IW = 0, IH = 0, LUM = null, ALPHA = null;

function loadSource(then) {
  const im = new Image();
  im.onload = () => {
    IW = im.naturalWidth; IH = im.naturalHeight;
    FACE_H = FACE_W * (IH / IW);
    MOUTH_Y = (MOUTH_FRAC - 0.5) * FACE_H;
    CHIN_Y = (CHIN_FRAC - 0.5) * FACE_H;
    EYE_Y = (EYE_FRAC - 0.5) * FACE_H;
    const off = document.createElement("canvas");
    off.width = IW; off.height = IH;
    const octx = off.getContext("2d", { willReadFrequently: true });
    octx.drawImage(im, 0, 0);
    // THE CUTOUT'S ALPHA IS THE STENCIL. A portrait exported with a
    // transparent background already says exactly where the head is --
    // far better than any luminance threshold, which cannot tell a dark
    // background from a shadowed jaw. Grab it BEFORE anything is
    // composited behind the picture, because that is the only moment it
    // still exists. A picture with no alpha comes back solid, so a flat
    // JPEG still behaves exactly as it always did.
    ALPHA = new Float32Array(IW * IH);
    {
      const a = octx.getImageData(0, 0, IW, IH).data;
      for (let i = 0, p = 3; i < ALPHA.length; i++, p += 4) ALPHA[i] = a[p] / 255;
    }
    // FEATHER THE STENCIL. A cutout's alpha is a cliff -- one pixel of
    // antialiasing and then nothing -- so the silhouette came out as a
    // scissor cut, which is the one edge in nature that does not exist.
    // Blurring the MASK rather than the picture turns that cliff into a
    // ramp a few dots wide, and the dots along it can then fade out
    // instead of stopping. The picture itself is untouched: blur that and
    // the likeness goes soft with it.
    {
      const R = Math.max(2, Math.round(Math.min(IW, IH) * 0.013));
      const tmp = new Float32Array(ALPHA.length);
      for (let y = 0; y < IH; y++) {
        let acc = 0;
        for (let x = -R; x <= R; x++) acc += ALPHA[y * IW + Math.min(IW - 1, Math.max(0, x))];
        for (let x = 0; x < IW; x++) {
          tmp[y * IW + x] = acc / (2 * R + 1);
          acc -= ALPHA[y * IW + Math.min(IW - 1, Math.max(0, x - R))];
          acc += ALPHA[y * IW + Math.min(IW - 1, Math.max(0, x + R + 1))];
        }
      }
      for (let x = 0; x < IW; x++) {
        let acc = 0;
        for (let y = -R; y <= R; y++) acc += tmp[Math.min(IH - 1, Math.max(0, y)) * IW + x];
        for (let y = 0; y < IH; y++) {
          ALPHA[y * IW + x] = acc / (2 * R + 1);
          acc -= tmp[Math.min(IH - 1, Math.max(0, y - R)) * IW + x];
          acc += tmp[Math.min(IH - 1, Math.max(0, y + R + 1)) * IW + x];
        }
      }
    }
    // BLACK BEHIND, NOT OVER. What sits under a cutout's alpha is
    // whatever the exporter left there -- often white. Read luminance off
    // that and the auto-levels normalise against a blazing surround, so
    // the head renders as a dim smudge. destination-over slides black
    // underneath without touching a pixel of the picture.
    octx.globalCompositeOperation = "destination-over";
    octx.fillStyle = "#000";
    octx.fillRect(0, 0, IW, IH);
    octx.globalCompositeOperation = "source-over";
    const px = octx.getImageData(0, 0, IW, IH).data;
    // One float per pixel: the renderer asks for this thousands of times
    // a build and does not want four bytes and a multiply each time.
    LUM = new Float32Array(IW * IH);
    for (let i = 0, p = 0; i < LUM.length; i++, p += 4) {
      LUM[i] = (0.299 * px[p] + 0.587 * px[p + 1] + 0.114 * px[p + 2]) / 255;
    }
    // SMOOTH IT FIRST. A photograph is noisy at the pixel level and the
    // renderer differentiates it: raw, every dot came out "steep", the
    // spike test fired everywhere and the face rendered as four hairy
    // clumps. A couple of box passes cost milliseconds once and turn the
    // gradient back into something that describes a cheekbone.
    for (let pass = 0; pass < 2; pass++) {
      const out = new Float32Array(LUM.length);
      for (let yy = 0; yy < IH; yy++) {
        for (let xx = 0; xx < IW; xx++) {
          let sum = 0, n = 0;
          for (let dy = -1; dy <= 1; dy++) {
            const ny = yy + dy; if (ny < 0 || ny >= IH) continue;
            for (let dx = -1; dx <= 1; dx++) {
              const nx = xx + dx; if (nx < 0 || nx >= IW) continue;
              sum += LUM[ny * IW + nx]; n++;
            }
          }
          out[yy * IW + xx] = sum / n;
        }
      }
      LUM = out;
    }
    // AUTO-LEVELS, so the face does not depend on how the photo was
    // exposed. The first two sources proved the point from both ends: a
    // backlit portrait put its brightest pixels in the BACKGROUND, and a
    // moody black-and-white one sat so low that nearly every dot fell
    // under the floor and the head vanished. Stretching the picture's own
    // 2nd-to-98th percentile into 0..1 makes any reasonable portrait land
    // in the range the renderer was tuned for.
    {
      const hist = new Int32Array(256);
      for (let i = 0; i < LUM.length; i++) hist[(LUM[i] * 255) | 0]++;
      const lo_n = LUM.length * 0.02, hi_n = LUM.length * 0.98;
      let acc = 0, lo = 0, hi = 255;
      for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= lo_n) { lo = i; break; } }
      acc = 0;
      for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= hi_n) { hi = i; break; } }
      const a0 = lo / 255, span = Math.max(0.05, (hi - lo) / 255);
      for (let i = 0; i < LUM.length; i++) {
        LUM[i] = Math.max(0, Math.min(1, (LUM[i] - a0) / span));
      }
    }
    // LOCAL CONTRAST, which is what finally made eyes and lips read.
    // Global levels only move the whole picture at once: a face lit from
    // one side still renders as a bright patch and a dark one, and the
    // features inside each patch stay flat. Subtracting a wide blur and
    // re-amplifying what is left is the same trick a darkroom print uses
    // -- every region gets its own exposure, so the eye sockets go dark
    // against their own cheeks instead of against the forehead.
    {
      const R = Math.max(4, Math.round(Math.min(IW, IH) * 0.08));
      const mean = new Float32Array(LUM.length);
      const tmp = new Float32Array(LUM.length);
      // Separable box blur: two passes of a running sum, because an
      // R-by-R kernel at this radius is tens of millions of adds.
      for (let y = 0; y < IH; y++) {
        let acc = 0;
        for (let x = -R; x <= R; x++) acc += LUM[y * IW + Math.min(IW - 1, Math.max(0, x))];
        for (let x = 0; x < IW; x++) {
          tmp[y * IW + x] = acc / (2 * R + 1);
          acc -= LUM[y * IW + Math.min(IW - 1, Math.max(0, x - R))];
          acc += LUM[y * IW + Math.min(IW - 1, Math.max(0, x + R + 1))];
        }
      }
      for (let x = 0; x < IW; x++) {
        let acc = 0;
        for (let y = -R; y <= R; y++) acc += tmp[Math.min(IH - 1, Math.max(0, y)) * IW + x];
        for (let y = 0; y < IH; y++) {
          mean[y * IW + x] = acc / (2 * R + 1);
          acc -= tmp[Math.min(IH - 1, Math.max(0, y - R)) * IW + x];
          acc += tmp[Math.min(IH - 1, Math.max(0, y + R + 1)) * IW + x];
        }
      }
      for (let i = 0; i < LUM.length; i++) {
        const detail = LUM[i] - mean[i];
        // Keep a little of the overall shape (the 0.45) so the face still
        // has a lit side; the rest is local.
        LUM[i] = Math.max(0, Math.min(1, 0.46 + detail * 2.6 + (mean[i] - 0.5) * 0.45));
      }
    }
    IMG = im;
    then();
  };
  // A missing picture must not leave a blank window with no explanation.
  im.onerror = () => { console.error("dotphoto: could not load " + SRC); };
  im.src = SRC;
}

function lumAt(x, y) {
  if (!LUM) return 0;
  const u = (x / FACE_W + 0.5) * IW;
  const v = (y / FACE_H + 0.5) * IH;
  if (u < 0 || v < 0 || u >= IW - 1 || v >= IH - 1) return 0;
  // Bilinear: the grid steps about a pixel and a half at a time, and
  // nearest-neighbour there turns a cheekbone into a staircase.
  const x0 = u | 0, y0 = v | 0, fx = u - x0, fy = v - y0;
  const i = y0 * IW + x0;
  return (LUM[i] * (1 - fx) + LUM[i + 1] * fx) * (1 - fy)
       + (LUM[i + IW] * (1 - fx) + LUM[i + IW + 1] * fx) * fy;
}

// IS THIS POINT PART OF THE HEAD AT ALL? Nearest-neighbour is right
// here: the answer is a yes or a no, and interpolating it only produces
// half-dots along the silhouette.
function alphaAt(x, y) {
  if (!ALPHA) return 1;
  const u = (x / FACE_W + 0.5) * IW;
  const v = (y / FACE_H + 0.5) * IH;
  if (u < 0 || v < 0 || u >= IW - 1 || v >= IH - 1) return 0;
  // Bilinear, now that the mask is a ramp rather than a yes or a no: the
  // whole point of the feather is the values BETWEEN the pixels.
  const x0 = u | 0, y0 = v | 0, fx = u - x0, fy = v - y0;
  const i = y0 * IW + x0;
  return (ALPHA[i] * (1 - fx) + ALPHA[i + 1] * fx) * (1 - fy)
       + (ALPHA[i + IW] * (1 - fx) + ALPHA[i + IW + 1] * fx) * fy;
}

// BLACK IS NOT THE FACE. A photo's background, hair and shadow side all
// sit near zero, and dots there would draw a rectangle of noise instead
// of a head. Everything below the floor is treated as the flat field the
// face emerges from, and an oval vignette fades the frame's corners.
const FLOOR = 0.05;

function heightAt(x, y) {
  const l = lumAt(x, y);
  // THE MASK IS A ROUNDED RECTANGLE, not an oval. Mind, 2026-10-15: an
  // oval shaved the corners off a portrait that wants to keep its
  // shoulders, and a plain rectangle ended on a hard line. A rounded
  // rect keeps the frame's shape and still has no corners to cliff off.
  //
  // Worked as a signed distance to the rounded box: negative inside,
  // zero on the border, positive outside -- which is what makes the
  // fade follow the shape instead of a radius. vx/vy are already in
  // half-picture units, so the box half-extent is 1 and CORNER is how
  // much of that is rounded away. RAMP is how far INSIDE the border the
  // taper starts: brightness follows h, so a gradual distance IS the
  // soft edge. Those two numbers are the only knobs here.
  const CORNER = 0.38, RAMP = 0.16;
  const ax = Math.abs(x / (FACE_W * 0.5)), ay = Math.abs(y / (FACE_H * 0.5));
  const ex = ax - (1 - CORNER), ey = ay - (1 - CORNER);
  const d = Math.hypot(Math.max(ex, 0), Math.max(ey, 0))
          + Math.min(Math.max(ex, ey), 0) - CORNER;
  const u = Math.max(0, Math.min(1, (d + RAMP) / RAMP));
  const vig = 1 - u * u * (3 - 2 * u);
  // Lifted and stretched into the band the renderer actually uses for
  // brightness (roughly 0.22 upward), so midtones -- which is most of a
  // face -- are not all rounded down into the flat field.
  // A LOW CUTOFF ON PURPOSE. Keeping only the bright dots left a
  // constellation of highlights with no face between them -- the
  // midtones ARE the face, and they are what the shading then sorts into
  // cheek, jaw and shadow.
  const n = Math.max(0, (l - FLOOR) / (1 - FLOOR));
  // Gamma below 1 opens the midtones: skin is mostly midtone, and left
  // linear it renders as a thin scatter of highlights.
  const h = (0.12 + 0.88 * Math.pow(n, 0.58)) * Math.max(0, vig);
  return h > 0.07 ? h : -1;
}

/* ------------------------------- the grid -------------------------------- */
/* Built once per resize: the height field never changes, only what the
 * renderer does with it, so sampling it every frame would be 8000 calls a
 * frame for an answer that is already known. */

let dots = [], scale = 1, cx = 0, cy = 0;
const STEP = 5;              // pixels between dots at 1x. Finer than the
                             // hand-built Mask: a photograph carries detail
                             // worth resolving, where a gaussian dome did not.

// ONE SIZE CONSTANT, USED BY BOTH ENDS. The lattice is laid out ONCE at
// build time against `scale`, and the frame loop recomputes `scale` every
// frame -- so for a while these were two different numbers, and changing
// the one in the frame loop moved the spikes and nothing else. The face
// rendered at exactly the same size however it was "resized", which is a
// maddening thing to look at while being told it has changed.
function faceScale() {
  const top = (typeof topInset === "function") ? topInset() : 0;
  const bot = (typeof chromeInset === "function") ? chromeInset() : 0;
  const usable = Math.max(120, H - top - bot);
  return { scale: Math.min(W * SIZE_W, usable * SIZE_H),
           cy: top + usable / 2 };
}

const SIZE_W = 0.34, SIZE_H = 0.38;   // how much of the window the head fills

function build() {
  dots = [];
  if (!LUM) return;            // the first call lands before the photo does
  const fit = faceScale();
  scale = fit.scale;
  cx = W / 2; cy = fit.cy;
  // The floor is what the canvas can actually draw, not a tuning choice;
  // it was 9, which silently clamped away every density change below it.
  const step = Math.max(4, STEP * (Math.min(W, H) / 900));
  // A WIDER STENCIL than the hand-built field wanted. The photo carries
  // detail far below the dot spacing, and sampling it tightly measures
  // skin texture rather than the shape of the face.
  const e = 0.035;
  const GSCALE = 0.16;       // the photo's gradients run an order of
                             // magnitude hotter than the gaussian field's;
                             // this puts them back in the range the spike
                             // test and the shading were tuned for.

  for (let py = -H * 0.62; py <= H * 0.62; py += step) {
    for (let px = -W * 0.55; px <= W * 0.55; px += step) {
      const x = px / scale, y = py / scale;
      // TWO LAYERS. The cutout's alpha decides which one a dot belongs
      // to: inside the silhouette it is the HEAD and reads the
      // photograph, outside it is BACKGROUND and reads nothing. The
      // field still covers the whole frame -- the head is simply the
      // only part of it carrying a picture, which is why a dark jaw no
      // longer has to compete with a dark backdrop to be seen.
      const av = alphaAt(x, y);
      const inHead = av >= 0.35;
      // How solidly this dot belongs to the head, 0 at the outer lip of
      // the feather and 1 once it is properly inside. The renderer fades
      // the rim out with it.
      const edge = Math.max(0, Math.min(1, (av - 0.35) / 0.40));
      const h = inHead ? heightAt(x, y) : 0;
      const on = inHead && h > 0;
      // The gradient: how steep the surface is here, and which way it
      // faces. The spikes ride on this.
      let gx = 0, gy = 0;
      if (on) {
        gx = GSCALE * (Math.max(0, heightAt(x + e, y)) - Math.max(0, heightAt(x - e, y))) / (2 * e);
        gy = GSCALE * (Math.max(0, heightAt(x, y + e)) - Math.max(0, heightAt(x, y - e))) / (2 * e);
      }
      // WHICH DOTS ARE THE MOUTH, worked out once. The height field is
      // static and the mouth is not, so baking an open mouth into h would
      // mean rebuilding eight thousand dots every frame. Instead each dot
      // carries how much it BELONGS to the mouth, and the renderer moves
      // it by that weight times the voice envelope.
      const my = y - MOUTH_Y;
      // HOW WIDE THE MOUTH IS. "Nothing at the cheeks" was wishful: at a
      // sigma of 0.34 the lip bands still carried half their weight out
      // at the cheekbones, so whatever the lips did was done by a stripe
      // running the full width of the face. With the bands tightened
      // vertically that stripe became a hard dark LINE across both cheeks
      // (Mind's screenshot, 2026-10-15). The mouth is about a quarter of
      // the picture wide; this is scaled to it.
      const across = gauss(x * x, 0.10);
      // THE LIPS ARE NARROW BANDS. They were not: at a sigma of 0.085
      // the "lower lip" still carried 0.82 weight a long way ABOVE the
      // mouth and 0.45 down at the chin -- a broad smear of face moving
      // on its own profile while the jaw underneath moved on another.
      // That mismatch IS the split Mind kept seeing (2026-10-15). A real
      // lower lip is about five per cent of the picture tall, so the band
      // is tightened to match and the jaw carries everything below it.
      // Tight enough to be lips, soft enough to have an EDGE rather than
      // a cut: under about 0.010 the band is thinner than the gap between
      // dots, so it stops being a lip and becomes a one-dot seam.
      const lipU = on ? across * gauss(Math.pow(my + 0.055, 2), 0.011) : 0;
      const lipL = on ? across * gauss(Math.pow(my - 0.065, 2), 0.013) : 0;
      const hole = on ? across * gauss(my * my, 0.016) : 0;
      // THE JAW. A hinge, not a ramp. It opens from nothing at the mouth
      // to full at the chin, then DIES just below it -- a real jaw ends
      // at the jawline, and everything under that is neck, which does not
      // move when you speak. The tail is short and soft rather than a
      // hard cut, so the chin does not shear away from the throat.
      // It tapers at the sides too: the jaw is widest at the chin and the
      // shoulders are not part of it at any depth.
      // IT HINGES AT THE UPPER LIP, not at the mouth's centre. Starting
      // the ramp at the mouth left the skin directly under the lower lip
      // moving at almost nothing while the lip itself moved a lot, and a
      // lip that travels further than the chin it sits on tears away from
      // it. Hinging a little higher and ramping LINEARLY puts the two
      // within a few per cent of each other all the way down, so the
      // whole lower face moves as one piece.
      let jaw = 0;
      if (on) {
        const hinge = MOUTH_Y - 0.06;
        const span = Math.max(0.01, CHIN_Y - hinge);
        const below = y - hinge;
        if (below > 0) {
          const r = Math.min(1, below / span);
          const tail = below <= span ? 1 : gauss(Math.pow(below - span, 2), 0.010);
          jaw = r * tail * gauss(x * x, 0.42);
        }
      }

      // WHICH DOTS ARE THE EYES, baked for the same reason the mouth is:
      // the picture is static and a blink is not. `eye` is how much a dot
      // belongs to an eye, `iris` the tighter core the gaze slides, and
      // `eyeSide` which eye it is so the pair can move together.
      const ey = y - EYE_Y;
      let eye = 0, iris = 0, eyeSide = 0;
      if (on) {
        for (const sgn of [-1, 1]) {
          const ex = x - (EYE_CX + sgn * EYE_DX);
          // A LID IS WIDER THAN IT IS TALL. A round blob closing reads as
          // a hole filling in; an oval reads as an eyelid.
          const w = gauss(ex * ex, 0.105) * gauss(ey * ey, 0.055);
          if (w > eye) { eye = w; eyeSide = sgn; }
          iris = Math.max(iris, gauss(ex * ex, 0.055) * gauss(ey * ey, 0.045));
        }
      }

      dots.push({
        px, py, h: on ? h : 0, on,
        lipU, lipL, hole, jaw, eye, iris, eyeSide,
        gx, gy, g: Math.min(2.2, Math.hypot(gx, gy)),
        // A per-dot phase so the idle drift and the scatter never move
        // as one slab.
        ph: Math.random() * Math.PI * 2,
        jx: (Math.random() - 0.5), jy: (Math.random() - 0.5),
        // its own twinkle rate, so no two dots breathe together
        tw: Math.random() * 0.8,
        edge: on ? edge * edge * (3 - 2 * edge) : 0,   // smoothstep
      });
    }
  }
}

/* ------------------------------ the render ------------------------------- */

const CRIMSON = [182, 2, 50];
/** The page's own background, for anything that has to be read ON the face. */
const BACKDROP = [7, 4, 5];
const HOT = [255, 140, 170];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t,
                          a[2] + (b[2] - a[2]) * t];

let last = performance.now(), t = 0;
let present = 0;        // 0 = grid only, 1 = face fully forward

/* ----------------------------- the signals ------------------------------- */
// TRAFFIC ON THE GRID. The field breathes and twinkles, but nothing
// TRAVELS across it, and a surface with no traffic reads as a screensaver
// rather than as a machine with something going on inside it. These are
// packets: each one runs a straight line across the field in face
// coordinates, brightening the dots it passes and dragging a short tail.
//
// They are drawn by the dots themselves, not as lines over the top. A
// stroke on top would sit in front of the head and give the whole thing a
// pane of glass; a packet that can only light up dots it passes stays
// inside the grid, and the head occludes it for free.
const SIGNALS = 7;
const signals_ = [];

function spawnSignal(now) {
  // Enter off one edge, leave by another: a packet that turns around
  // inside the frame reads as a firefly, not a transmission.
  const edge = Math.random() * 4 | 0;
  const span = 2.4, out = 1.9;
  const a = (Math.random() - 0.5) * span;
  const from = [[-out, a], [out, a], [a, -out], [a, out]][edge];
  const to = [[out, a + (Math.random() - 0.5)], [-out, a + (Math.random() - 0.5)],
              [a + (Math.random() - 0.5), out], [a + (Math.random() - 0.5), -out]][edge];
  const dx = to[0] - from[0], dy = to[1] - from[1];
  const len = Math.hypot(dx, dy) || 1;
  return {
    x: from[0], y: from[1],
    vx: dx / len, vy: dy / len,
    speed: 0.9 + Math.random() * 1.9,     // field-widths a second
    width: 0.055 + Math.random() * 0.075, // how far either side it lights
    gain: 0.5 + Math.random() * 0.9,
    born: now,
    // A packet that never dies leaves the frame and keeps costing a
    // distance check per dot per frame for ever.
    dies: now + 14,
  };
}

function updateSignals(now, dts) {
  while (signals_.length < SIGNALS) signals_.push(spawnSignal(now));
  for (let i = signals_.length - 1; i >= 0; i--) {
    const g = signals_[i];
    g.x += g.vx * g.speed * dts;
    g.y += g.vy * g.speed * dts;
    if (now > g.dies || Math.abs(g.x) > 2.2 || Math.abs(g.y) > 2.2) {
      signals_[i] = spawnSignal(now);
    }
  }
}

// How much a point is lit by the traffic passing it. Distance to the
// packet's LINE, not to the packet, so the light has a direction and a
// tail instead of being a travelling blob.
function signalAt(x, y) {
  let lit = 0;
  for (let i = 0; i < signals_.length; i++) {
    const g = signals_[i];
    const rx = x - g.x, ry = y - g.y;
    const along = rx * g.vx + ry * g.vy;
    // only behind the head of the packet: that is what makes it a tail
    if (along > 0.02 || along < -0.9) continue;
    const perp = Math.abs(rx * -g.vy + ry * g.vx);
    if (perp > g.width) continue;
    const across = 1 - perp / g.width;
    const tail = 1 + along / 0.9;          // 1 at the head, 0 at the end
    lit += g.gain * across * across * tail * tail;
  }
  return lit;
}
let scatter = 0;        // thinking: the grid comes apart
let ripple = -1;        // listening: a ring travelling outward
let open = 0;           // speaking: how far the mouth is open, 0..1
// THE EYES. Added 2026-10-15, and the reason is not decoration: the mouth
// was doing the whole job, which is backwards from how anyone reads a
// face. Nobody notices mouth accuracy; everybody notices dead eyes.
let blink = 0;          // 0 open, 1 shut
let blinkHold = 0;      // seconds left at fully shut before the lid opens
let blinkAt = 1.2;      // when the next one fires, in seconds on t
let gazeX = 0, gazeY = 0;         // where the eyes are actually pointed
let gazeTX = 0, gazeTY = 0;       // where they are heading
let gazeAt = 0.8;       // when the gaze next picks a new place to rest
let heard = 0;          // a smoothed version of the mic, 0..1
let ringPhase = 0;      // how far the voice rings have travelled outward

// MUSIC MODE. backtalk's ears already measure a 32-band spectrum of what
// the room is playing and publish it to the bus (music.py -> .voice_music
// -> AV.music / AV.bands), so the face does NOT open the microphone --
// the music arrives on the same device backtalk owns, and taking that
// device kills the voice line outright (2026-10-15). The Radial has had a
// music mode since; this is the Portrait's.
//
// The bus refreshes about eight times a second and the screen draws
// sixty, so every band is eased toward its reading rather than used raw:
// fast up so the kick lands on the frame it happens, slower down so the
// corona falls instead of flickering.
const BANDS = 32;
const musicMags = new Float32Array(BANDS);
let musicT = 0;         // 0 = voice face, 1 = fully in music mode
/**
 * COMPACTING, AS SOMETHING YOU CAN SEE (Mind, 2026-10-15).
 *
 * Compaction is the one long pause where nothing is wrong and nothing
 * is happening: the face sits idle for a minute and reads as frozen. So
 * a band of light travels up the portrait and the dots it crosses are
 * pulled toward the centre and lit -- the picture visibly being gathered
 * up and condensed, which is what is actually going on inside.
 *
 * SMOOTHED, NOT SWITCHED, so it arrives and leaves rather than
 * appearing. The band's own travel is on the frame clock, independent of
 * it, so the sweep is already mid-stroke when the glow comes up.
 */
let compactT = 0;
let bass = 0, kick = 0; // smoothed low end, and the transient off it
let spin = 0;           // the corona turns, slowly, and faster on the kick

function musicLive() {
  // Her own voice wins: if she is talking or thinking, that is the thing
  // worth drawing, and the "music" she can hear then is her own output
  // bleeding back into the mic.
  const st = AV.state;
  return !!AV.music && st !== "speaking" && st !== "thinking";
}

function readBands(dt) {
  const live = musicLive();
  const b = (live && AV.bands) || [];
  for (let k = 0; k < BANDS; k++) {
    const target = live ? (b[k] || 0) : 0;
    const rate = target > musicMags[k] ? 0.55 : 0.16;
    musicMags[k] += (target - musicMags[k]) * Math.min(1, rate * dt / 16.667);
  }
  // The low four bands are the kick and the bass line; everything the
  // head's pulse rides on comes from here.
  let lo = 0;
  for (let k = 0; k < 4; k++) lo += musicMags[k];
  lo /= 4;
  const prev = bass;
  bass += (lo - bass) * Math.min(1, dt / 70);
  // A transient, not a level: what makes a beat read as a HIT is the
  // jump, so the kick is the rise and it decays on its own clock.
  kick = Math.max(kick - dt / 260, Math.max(0, bass - prev) * 6);
  kick = Math.min(1, kick);
  musicT += ((live ? 1 : 0) - musicT) * Math.min(1, dt / 420);
  compactT += ((AV.compacting ? 1 : 0) - compactT) * Math.min(1, dt / 500);
  spin += (dt / 1000) * (0.05 + 0.9 * bass);
}

// Which band a point in the field belongs to. The corona is a POLAR
// spectrum: angle picks the band, so the field around her head becomes a
// ring of bars that dance -- the low end at the top and climbing round.
// Using radius instead was the first idea and it reads as a target, not
// as music.
function bandAt(dx, dy) {
  let ang = Math.atan2(dy, dx) + Math.PI / 2 + spin;
  ang = ((ang % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  // mirrored: the spectrum runs up one side and back down the other, so
  // the corona is symmetrical rather than having a visible seam
  const h = ang / Math.PI;                       // 0..2
  const u = h <= 1 ? h : 2 - h;                  // 0..1..0
  const i = u * (BANDS - 1);
  const k = Math.floor(i), f = i - k;
  const a = musicMags[k] || 0, bq = musicMags[Math.min(BANDS - 1, k + 1)] || 0;
  return a + (bq - a) * f;
}

// THE FACE SITS BETWEEN THE PANELS, not in the middle of the window.
// The transcript owns the bottom quarter of the screen and the activity
// strip owns the top edge -- centring on the window put the mouth and
// chin behind the transcript, which is a poor look for the one feature
// Mind asked for. The insets come from the shared HUD and change as the
// transcript grows, so this is read every frame rather than at build.
function fitBetweenPanels() {
  const fit = faceScale();
  cy = fit.cy;
  // REBUILD WHEN THE SIZE REALLY MOVES. The lattice is baked against the
  // scale it was built with, so drifting `scale` underneath it stretches
  // the pushes and leaves the face itself alone. The transcript grows by
  // a line at a time, so a 4% threshold keeps this off the hot path.
  if (Math.abs(fit.scale - scale) > scale * 0.04) build();
  scale = fit.scale;
}

function frame(now) {
  const dt = Math.min(64, now - last); last = now; t += dt / 1000;
  // THE CONTRACT. core.js polls the bus, but a face has to ASK it to
  // publish -- AV.state, AV.env and AV.micLevel only move when tick is
  // called. Leave this out and the face reads its startup values for
  // ever: it animates, it never errors, and it simply never hears the
  // voice line. That is exactly what happened on the night this face was
  // built -- "even when you're talking, it doesn't move" -- and it cost
  // an hour of looking at a bus that was working perfectly the whole
  // time. The face was the broken end.
  AV.tick(dt);
  fitBetweenPanels();
  const state = AV.state || "idle";
  const env = AV.env || 0;            // speech envelope, 0..1
  const mic = AV.micLevel || 0;
  readBands(dt);

  // The face comes forward to speak and retreats the rest of the time --
  // the same idea as the Radial's orb, and the reason this does not just
  // sit there staring all day.
  let want = state === "speaking" ? 1 : state === "listening" ? 0.62
           : state === "thinking" ? 0.34 : 0.54;
  // Music mode brings her forward and lets the low end move her: she is
  // not waiting for an instruction, she is listening to the track.
  if (musicT > 0.01) want = want * (1 - musicT) + musicT * (0.70 + 0.30 * bass);
  present += (want - present) * Math.min(1, dt / (want > present ? 180 : 420));
  scatter += ((state === "thinking" ? 1 : 0) - scatter) * Math.min(1, dt / 500);

  if (state === "listening") {
    if (ripple < 0 && mic > 0.35) ripple = 0;
    if (ripple >= 0) { ripple += dt / 900; if (ripple > 1.6) ripple = -1; }
  } else ripple = -1;

  // Backdrop: a slow crimson bloom behind the face, so the dark side of
  // the grid is not pure black.
  ctx.fillStyle = "#070405";
  ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.55);
  // Dimmer than the Mask's: a photograph's shadows ARE the drawing, and
  // a bloom behind them fills the very gaps that make the face read.
  glow.addColorStop(0, rgba(CRIMSON,
    0.07 + 0.07 * present + 0.08 * env + musicT * (0.10 * bass + 0.14 * kick)));
  glow.addColorStop(1, "rgba(7,4,5,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // HOW FAR THE MOUTH IS OPEN. The envelope alone is too twitchy to read
  // as a jaw -- a jaw has mass -- so it chases the envelope, opening fast
  // and closing slower, which is also how a real one moves.
  // DON'T PEG. The envelope was multiplied by 1.4 and clamped, so
  // anything louder than about seven tenths asked for a fully open mouth
  // -- and across a long sentence that is most of it, which is why the
  // jaw just hung there (Mind, 2026-10-15: "your mouth pegs open"). Under
  // 1.0 it never saturates, so the top of the range stays available for
  // the loud syllables instead of being spent on the ordinary ones.
  // The curve matters more than the ceiling: squaring the quiet end
  // keeps the mouth nearly shut between words and lets it travel on the
  // vowels, which is where the read comes from.
  const e = Math.min(1, env * 0.95);
  const wantOpen = state === "speaking" ? e * (0.35 + 0.65 * e) : 0;
  // And a softer chase on the way in, so a syllable lands as a swing
  // rather than a snap; the close stays quicker than the open, because a
  // jaw falls open and is pulled shut.
  open += (wantOpen - open) * Math.min(1, dt / (wantOpen > open ? 78 : 135));

  // BLINKING, ON AN IRREGULAR CLOCK. A blink on a fixed timer reads as a
  // metronome within about twenty seconds -- the eye is very good at
  // catching a period. So the gap is random between roughly two and seven
  // seconds, and now and then it fires a double, which is what real eyes
  // do. The close is fast and the open is slower, like a real lid.
  if (t > blinkAt) {
    blink = 1;
    blinkAt = t + 2.0 + Math.random() * 5.0;
    if (Math.random() < 0.18) blinkAt = t + 0.22;   // the occasional double
    blinkHold = 0.055;                              // shut, briefly, before it opens
  }
  // A REAL LID SHUTS, STAYS SHUT A MOMENT, THEN OPENS. The first version
  // started decaying the same frame it fired, so at sixty hertz the whole
  // blink was over in a handful of frames and read as a flicker rather
  // than an eye closing -- Mind could barely see it. The hold is what
  // makes it legible; the slower open is what makes it a lid.
  if (blinkHold > 0) blinkHold -= dt / 1000;
  else blink += (0 - blink) * Math.min(1, dt / 165);

  // GAZE DRIFT. A face that holds one stare is a photograph; a face whose
  // eyes settle somewhere new every few seconds is somebody thinking. It
  // comes home to centre while speaking -- he is being looked at then,
  // and wandering eyes mid-sentence read as evasive rather than alive.
  if (t > gazeAt) {
    gazeAt = t + 1.4 + Math.random() * 3.2;
    gazeTX = (Math.random() - 0.5) * 1.6;
    gazeTY = (Math.random() - 0.5) * 0.9;
  }
  const home = state === "speaking" ? 0.12 : 1;
  gazeX += (gazeTX * home - gazeX) * Math.min(1, dt / 220);
  gazeY += (gazeTY * home - gazeY) * Math.min(1, dt / 260);

  // WHAT MIND'S VOICE DOES TO THE FIELD. Mind, 2026-10-15: "when I talk,
  // I want some kind of animation of the dots in the background."
  // The raw mic is jittery enough to strobe, so it is smoothed -- fast up
  // so the field answers the first syllable, slow down so it does not
  // flicker between words -- and drives rings that run outward from the
  // face continuously while he is talking, rather than the single ping
  // the old listening ripple fired once per utterance.
  // WHERE THE LEVEL COMES FROM. Not the browser: opening the mic here
  // takes the device from backtalk and the voice line goes deaf
  // (2026-10-15). Instead the process that already owns the microphone
  // publishes its own measured loudness to the bus, and the face reads it.
  // The mic level is REAL now -- backtalk's ears publish it to the bus, so
  // the rings answer the actual room instead of the fake sine that stood in
  // for it. The field only moves while the line is open to him: a level
  // arriving during "speaking" is this machine's own voice leaking into the
  // microphone, and the mouth already draws that.
  const wantHeard = (state === "listening" || state === "idle") ? mic : 0;
  heard += (wantHeard - heard) * Math.min(1, dt / (wantHeard > heard ? 90 : 420));
  ringPhase += (dt / 1000) * (0.35 + 1.5 * heard);

  const breath = 0.5 + 0.5 * Math.sin(t * 0.9);
  // IDLE BREATHING, and deliberately a slow one: about five and a half
  // seconds a cycle, which is a resting human breath rather than the
  // panting that anything faster reads as. It fades out as the face comes
  // forward -- a head that keeps breathing while it talks looks like it
  // is bobbing, not alive.
  const idleBreath = Math.sin(t * 1.15) * (1 - present * 0.75);

  // The traffic runs on wall-clock seconds, so it keeps its speed if the
  // tab is throttled and resumes instead of teleporting.
  updateSignals(t, Math.min(0.05, dt / 1000));
  // A SLOW WAVE down the face, always running. Idle used to be a breath
  // so gentle the whole thing read as a still image -- "it's not moving
  // right now, do I need to restart something?" -- which is the worst
  // thing a live face can look like. This is what says it is running.
  const waveY = (t * 0.22) % 2 - 0.5;
  /* The compaction band, bottom to top, a little over a second a pass.
     Same normalised space as the breath wave, so it reads at any size. */
  const compactY = compactT > 0.01 ? 0.9 - ((t * 0.8) % 1) * 1.9 : -99;
  const push = scale * (0.012 + 0.014 * present + 0.030 * env);
  // TAILS, SHORTER WHEN SPEAKING. The voice term used to be the biggest
  // of the three, so every syllable threw hair off the whole head and the
  // features vanished underneath it. The spikes now describe the face
  // first and the voice second.
  const spikeLen = scale * (0.020 + 0.030 * present + 0.022 * env);

  for (const d of dots) {
    let px = d.px, py = d.py;

    // Thinking: every dot wanders off its lattice point and comes back.
    if (scatter > 0.01) {
      const s = scatter * scale * 0.05 * (1 + Math.sin(t * 1.7 + d.ph));
      px += d.jx * s; py += d.jy * s;
    }

    if (!d.on) {
      // The flat field the face sits in. It is what makes the face read
      // as EMERGING from a grid rather than floating on black.
      let a = 0.17 + 0.07 * Math.sin(t * 0.7 + d.ph)
            + 0.10 * Math.exp(-Math.pow((py / scale) - waveY, 2) / 0.08);

      // A CROSS-CURRENT, always running. The downward wave alone moves
      // every dot in a row together, which reads as a scanline. A second,
      // slower diagonal at an odd frequency never repeats against it, so
      // the field drifts instead of scanning -- alive in dead silence,
      // which is most of the time this face is on screen.
      const dx = px / scale, dy = py / scale;
      a += 0.055 * Math.sin((dx * 1.7 + dy * 1.1) - t * 0.31);
      // and a slow bloom breathing out from the middle, so the grid has
      // depth as well as drift
      a += 0.045 * Math.sin(Math.hypot(dx, dy) * 2.1 - t * 0.47);

      // EACH DOT ON ITS OWN CLOCK. Everything above moves the field as a
      // body; this is what stops it reading as a mechanism. Two sines at
      // rates that share no common multiple, seeded off the dot's own
      // phase, never line up twice -- cheaper than a noise function and
      // indistinguishable at this amplitude.
      // Multiplying two sines was the mistake: the product sits near zero
      // most of the time, so the amplitude on paper was never the
      // amplitude on screen. One sine carries the twinkle, the slower one
      // only shapes how deep it goes.
      a += 0.17 * Math.sin(t * (1.4 + d.tw * 1.6) + d.ph * 5.1)
         * (0.55 + 0.45 * Math.sin(t * 0.31 + d.ph));

      // THE VOICE RINGS. Distance from the face decides a dot's place in
      // the wave, so the whole field reads as one thing moving outward
      // instead of eight thousand dots blinking independently. Each ring
      // both brightens its dots and pushes them a little further out --
      // brightness alone reads as a flicker; the small displacement is
      // what makes it read as a wave crossing the grid.
      const rN = Math.hypot(px, py) / scale;
      // AND A LITTLE WANDER. Held well under the dot spacing: past that
      // the lattice stops reading as a lattice and the whole field turns
      // to static.
      px += d.jx * scale * 0.012 * Math.sin(t * (0.5 + d.tw * 0.6) + d.ph);
      py += d.jy * scale * 0.012 * Math.cos(t * (0.4 + d.tw * 0.7) + d.ph * 1.7);
      let bx = px, by = py;
      if (heard > 0.02) {
        const wave = Math.sin(rN * 5.2 - ringPhase * 6.0);
        const reach = Math.max(0, 1 - rN / 2.6);     // fades off the edges
        const amp = heard * reach;
        a += 0.42 * amp * Math.max(0, wave);
        const shove = amp * wave * scale * 0.035;
        bx += (px / (rN * scale || 1)) * shove;
        by += (py / (rN * scale || 1)) * shove;
      }

      // The old single ping stays for the moment listening BEGINS: the
      // rings describe how loud he is, this says the line just opened.
      if (ripple >= 0) {
        const rr = Math.hypot(px, py) / (scale * 1.6);
        a += 0.45 * Math.max(0, 1 - Math.abs(rr - ripple) * 9) * mic;
      }
      // THE CORONA. In music mode the field stops being a texture and
      // becomes the spectrum: each dot asks which band owns its angle,
      // and that band both brightens it and throws it outward. Because
      // the push grows with radius, the inner dots hold their lattice
      // around her head and the outer ones fly -- so it reads as bars
      // radiating off her rather than the whole grid inflating.
      if (musicT > 0.01) {
        const m = bandAt(dx, dy);
        const reach = Math.min(1, rN / 0.75);       // leaves her face alone
        const amp = musicT * m * reach;
        a += 0.70 * amp;
        const shove = amp * scale * (0.16 + 0.10 * kick);
        const ux = px / (rN * scale || 1), uy = py / (rN * scale || 1);
        bx += ux * shove; by += uy * shove;
        // and the kick snaps the whole field out a touch, all at once
        bx += ux * musicT * kick * scale * 0.035;
        by += uy * musicT * kick * scale * 0.035;
      }

      // THE TRAFFIC. A packet passing lifts a dot well above the field,
      // which is what makes it read as a signal rather than a ripple --
      // the field is a texture, this is an event.
      const lit = signalAt(dx, dy);
      a += 0.55 * lit;
      const sz = 2 + (heard > 0.02 ? Math.round(heard * 1.6) : 0)
                   + (lit > 0.55 ? 1 : 0)
                   + (musicT > 0.3 && bandAt(dx, dy) > 0.6 ? 1 : 0);
      ctx.fillStyle = rgba(CRIMSON, Math.max(0, a));
      ctx.fillRect(cx + bx - sz / 2, cy + by - sz / 2, sz, sz);
      continue;
    }

    // THE MOUTH MOVES. The lips part, the jaw swings down beneath them,
    // and the aperture between recedes -- a hole reads as a hole because
    // it is darker than its edges, not because anything draws one.
    let h = d.h;
    if (open > 0.01) {
      const gap = open * scale * 0.094;
      // The jaw is already squared in the mask, so it is used STRAIGHT
      // here -- squaring it twice was what left the chin almost still
      // while the lower lip slid off it on its own.
      // The lip rides the jaw rather than moving beside it: its own
      // travel is small and added on top of whatever the jaw under it is
      // already doing, which is how a mouth opens.
      // The lip's own travel is now a TOPPING on the jaw's, not a rival
      // to it: 0.30 against the jaw's 1.0, which is what gives the lower
      // lip its curl without letting it leave the chin behind.
      const swing = d.jaw * gap;
      py += swing + d.lipL * 0.30 * gap;                      // jaw, lower lip
      py -= d.lipU * 0.16 * gap;                              // upper lip
      h -= d.hole * open * 0.36;                              // the gap darkens
      h += (d.lipU + d.lipL) * open * 0.08;                   // lips catch light
    }

    // THE EYES CLOSE, AND THEY LOOK AROUND.
    //
    // A blink is drawn by FILLING THE SOCKET IN rather than by drawing a
    // lid over it. The dark hollow IS the eye here -- it is what the
    // photograph's shadow gives us -- so lifting those dots up to the
    // brightness of the skin around them erases the eye for a moment,
    // which is exactly what a closed lid looks like. Nothing is added to
    // the scene; a feature is briefly taken out of it.
    // Brighter as well as longer: the socket has to come UP to the skin
    // around it, and at 0.42 it only came half way, so the eye dimmed
    // rather than closed.
    // IT FLASHES, IT DOES NOT ZOOM (Mind, 2026-10-15). Raising h brightens
    // a dot AND moves it: h feeds the depth push and the dot radius as
    // well as the colour, so the socket was swelling toward the camera as
    // it lit up and the blink read as the eye bulging. So the lid's lift
    // is kept OUT of the geometry below -- `hG` is the height the
    // positions and sizes are built from, and only the brightness sees
    // the blink.
    const bl = blink > 0.01 ? d.eye * blink * 1.05 : 0;
    h += bl;
    const hG = h - bl;
    // The gaze slides the iris's dots sideways within the socket. Only a
    // few pixels -- it is a long way under the dot spacing, so the
    // lattice holds and the likeness with it, and the dark core moving
    // inside a fixed socket is read as a pupil every time.
    if (d.iris > 0.004) {
      px += d.iris * gazeX * scale * 0.026;
      py += d.iris * gazeY * scale * 0.016;
    }

    // Depth does the work: out from centre, bigger, brighter.
    // The wave adds a little depth as it passes, so a band of the face
    // lifts and settles like something breathing under a sheet.
    const wv = Math.exp(-Math.pow((d.py / scale) - waveY, 2) / 0.10);
    const lift = Math.max(0, hG) * present * (0.84 + 0.16 * breath) * (1 + 0.14 * wv);
    // ALMOST NO PERSPECTIVE PUSH. The hand-built Mask threw its dots
    // outward by height to fake depth, which is free when the "image" is
    // a smooth dome. Doing it to a PHOTOGRAPH smears the photograph:
    // every dot leaves the pixel it was sampling, and the likeness --
    // the only thing this face has -- goes with it. Here the dots hold
    // their lattice like a halftone and let brightness and size carry
    // the picture, with just enough drift to read as three-dimensional.
    // The breath itself: the whole head swells a little and settles,
    // around its own centre, so it reads as the chest behind it rather
    // than as the picture zooming.
    // THE HEAD RIDES THE BEAT. A small swell on the kick -- about two per
  // cent -- which is the difference between a face in front of music and
  // a face listening to it. Anything larger reads as a bouncing photo.
  const k = (1 + lift * 0.05) * (1 + idleBreath * 0.011)
            * (1 + musicT * (0.012 * bass + 0.016 * kick));
    /* THE COMPACTION BAND. A dot inside it is pulled toward the centre
       and lit -- a stripe of the picture being gathered in, travelling
       up the face. The pull is small: this is the portrait, and a dot
       that leaves its pixel takes the likeness with it. */
    const cb = compactT > 0.01
      ? compactT * Math.exp(-Math.pow((d.py / scale) - compactY, 2) / 0.012) : 0;
    const gather = 1 - cb * 0.085;
    const x = cx + (px * k) * gather + (px / scale) * push * lift;
    const y = cy + (py * k) * gather + (py / scale) * push * lift;

    // Brightness across the face's OWN depth range, not an absolute
    // scale. The first version saturated: every dot above a low height
    // came out equally bright, so the sockets, the nose and the mouth all
    // washed out into one dotted egg. Lighting a face is contrast, and
    // contrast needs the range it actually occupies.
    // h IS ALREADY THE PICTURE. The hand-built field needed remapping
    // because its heights bunched between 0.22 and 0.84; a levelled
    // photograph already spans the range, and re-squeezing it threw away
    // most of the face's midtones.
    // The traffic crosses the head as well, but at a fraction of its
    // strength on the field: the likeness is the only thing this face
    // has, and a bright packet running over it erases a cheekbone.
    const litF = signalAt(d.px / scale, d.py / scale) * 0.30;
    // THE MUSIC CROSSES HER FACE TOO. The corona needs empty field to
    // live in, and at the size she is usually drawn there barely is any
    // -- the head fills the frame. So the spectrum also plays ON the
    // portrait: the band owning a dot's angle lifts it and lengthens the
    // shading run off it, so bars of light sweep the face and the steep
    // parts bristle on the loud bands. Held small on purpose: the
    // likeness is the only thing this face has, and a spectrum painted
    // over it at full strength erases a cheekbone.
    const mF = musicT > 0.01
      ? musicT * bandAt(d.px / scale, d.py / scale) : 0;
    const depth = Math.max(0, Math.min(1, h * 1.05));
    const near = depth * (0.35 + 0.65 * present) * (1 + idleBreath * 0.045)
                 * (1 + mF * 0.55);
    // A WIDE SWING between shadow and highlight is the whole trick: in
    // the reference, dark areas carry almost no dots and lit ones carry
    // big bright ones. A uniform dot over the whole face reads as a
    // blob however well it is sampled.
    const a = ((0.11 + 1.45 * near) * (1 + 0.22 * wv) + litF + cb * 0.55) * d.edge;
    const col = mix(CRIMSON, HOT,
    Math.min(1, near * (0.70 + 0.70 * env + musicT * 0.80 * kick) + cb * 0.85));
    // The rim's dots shrink as well as dim. Fading alone leaves a ring
    // of full-sized ghosts and still reads as a cut line.
    // The radius comes off the GEOMETRIC height, so a closing lid does
    // not inflate the dots it brightens.
    const nearG = Math.max(0, Math.min(1, hG * 1.05))
                  * (0.35 + 0.65 * present) * (1 + idleBreath * 0.045) * (1 + mF * 0.55);
    const r = (0.35 + 3.1 * nearG) * (0.45 + 0.55 * d.edge);

    // The spikes: thrown off the steep parts, pointing the way the
    // surface falls away. This is the whole character of the reference
    // image, and it is just the gradient drawn as a line.
    // ONLY THE STEEP PARTS. The first version spiked everywhere and the
    // face came out as a hairy egg: the rim, the sockets and the nose
    // wall are where the surface actually falls away.
    // SHADING, NOT HAIR. These were strokes: a line thrown down the
    // gradient off every steep dot. On the hand-built dome that read as
    // character, but on a photograph the steep parts are the eye sockets,
    // the nose wall and the jaw -- exactly the features -- so at a whole
    // head's scale thousands of one-pixel lines crossed each other and
    // came out as bristles growing out of the face (Mind's screenshot,
    // 2026-10-15). Same gradient, same direction, drawn instead as two or
    // three smaller, dimmer dots stepping down it. A dot cannot cross its
    // neighbour, so the shading stays a tone rather than a texture.
    if (d.g > 1.15 && present > 0.15) {
      const L = spikeLen * (1 + mF * 2.2)
                * Math.min(1, (d.g - 1.0) * 0.8) * (0.5 + 0.9 * (1 - near));
      const n = Math.hypot(d.gx, d.gy) || 1;
      const ux = -(d.gx / n) * L, uy = -(d.gy / n) * L;
      // HALVED 2026-10-15 to see what the shading actually buys: three
      // steps and two became two and one. The run still steps down the
      // gradient, with half the dots drawn to do it.
      const steps = L > scale * 0.030 ? 2 : 1;
      for (let i = 1; i <= steps; i++) {
        const f = i / steps;
        // each step out is dimmer and smaller, so the run fades into the
        // surface instead of ending on a hard last dot
        const fade = (1 - f * 0.72) * (0.10 + 0.26 * present) * d.edge;
        ctx.fillStyle = rgba(col, Math.max(0, fade));
        ctx.beginPath();
        ctx.arc(x + ux * f, y + uy * f, Math.max(0.3, r * (0.42 - 0.12 * f)),
                0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.fillStyle = rgba(col, a);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // The Radial hides its panels in music mode behind body.music; same
  // class here, so the CSS above can do the same without the face
  // knowing anything about the HUD.
  document.body.classList.toggle("music", musicT > 0.05);

  drawChips(t);

  // An alert turns the whole field cold-hot: the one thing that must not
  // be subtle.
  if (AV.alert) {
    ctx.strokeStyle = rgba(HOT, 0.35 + 0.25 * Math.sin(t * 7));
    ctx.lineWidth = 3;
    ctx.strokeRect(6, 6, W - 12, H - 12);
  }

  requestAnimationFrame(frame);
}

/**
 * THE STATUS CHIPS (Mind, 2026-10-15).
 *
 * Three states change what the voice line will DO, and none of them used
 * to show on this face: compacting (she is busy and will be slow),
 * music mode (nothing is being transcribed), answer-only (the mic
 * ignores anything that does not say her name). A person glancing at the
 * screen should be able to tell why she is not answering.
 *
 * DRAWN ON THE CANVAS, not added to the HUD, for two reasons: the HUD
 * fades out in music mode -- which is exactly when one of these needs to
 * be legible -- and a chip in the canvas cannot shift the layout the
 * face's centre is fitted against.
 *
 * ONE ROW, CENTRED JUST ABOVE THE TRANSCRIPT (Mind's placement). The
 * first pass drew them along the bottom, where the chat runs, and a chip
 * under a wall of text is a chip nobody sees -- "I did not see a chip".
 * So the row is MEASURED off the transcript panel rather than guessed
 * from the window: the panel moves with the chat's own layout, and a
 * fixed offset would drift the moment it did.
 *
 * In music mode the transcript fades to nothing but keeps its box, which
 * is what holds this row still while the chat disappears underneath it.
 *
 * They fade with their own state rather than popping, so a chip
 * arriving is not mistaken for something flashing.
 */
const chipFade = { compacting: 0, music: 0, answer: 0 };

function drawChips(t) {
  const want = {
    compacting: AV.compacting ? 1 : 0,
    music: musicT > 0.5 ? 1 : 0,
    answer: AV.answerOnly ? 1 : 0,
  };
  const labels = {
    compacting: "COMPACTING",
    music: "MUSIC MODE",
    answer: "ANSWER ONLY",
  };
  const live = [];
  for (const k of ["compacting", "music", "answer"]) {
    chipFade[k] += (want[k] - chipFade[k]) * 0.08;
    if (chipFade[k] > 0.02) live.push(k);
  }
  if (!live.length) return;

  /* SHORTER, AND SOLID (Mind, 2026-10-15: "the fill needs to be darker
     not lighter"). A translucent crimson pill sat on top of the face and
     read as a smear; the text has to sit on the BACKGROUND colour, so
     the label is legible wherever the row happens to cross her. Squat,
     dark, outlined in crimson. */
  const pad = Math.max(10, Math.round(scale * 0.018));
  const h = Math.max(18, Math.round(scale * 0.034));
  const fs = Math.max(10, Math.round(h * 0.50));
  ctx.font = `600 ${fs}px 'SF Mono',Menlo,Consolas,monospace`;
  ctx.textBaseline = "middle";

  const widths = live.map((k) => ctx.measureText(labels[k]).width + pad * 2);
  const gap = Math.round(pad * 0.8);
  let x = (W - (widths.reduce((a, b) => a + b, 0) + gap * (live.length - 1))) / 2;
  /* Just above the chat, measured. Falls back to a bottom margin if the
     panel is not in the page at all, so a face without the HUD still
     shows its statuses somewhere sane. */
  const panel = document.getElementById("transcript-panel");
  const top = panel ? panel.getBoundingClientRect().top : H - h * 2;
  const y = Math.round(Math.max(8, top - h - Math.max(10, h * 0.45)));

  live.forEach((k, i) => {
    const w = widths[i];
    const f = Math.min(1, chipFade[k]);
    /* COMPACTING BREATHES, the other two sit still. It is the only one
       of the three that means "wait", and a still chip reads as a label
       rather than as something in progress. */
    const pulse = k === "compacting" ? 0.72 + 0.28 * (0.5 + 0.5 * Math.sin(t * 3.2)) : 1;
    const alpha = f * pulse;

    ctx.beginPath();
    const r = h / 2;
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fillStyle = rgba(BACKDROP, 0.88 * alpha);
    ctx.fill();
    ctx.strokeStyle = rgba(CRIMSON, 0.55 * alpha);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = rgba(HOT, 0.92 * alpha);
    ctx.fillText(labels[k], x + pad, y + h / 2 + 0.5);
    x += w + gap;
  });
}

// NO BROWSER MIC. core.js can open the microphone itself (`{mic:true}`),
// and it does make AV.micLevel real -- but on this machine the browser
// taking the device stopped BACKTALK from hearing Mind at all, which
// trades a background animation for the entire voice line. Never worth
// it. The field is driven from the voice line's own state instead; see
// the rings in the render loop.
AV.init({});

resize();
// The photo arrives late, so the grid is built twice: once empty, once for
// real. The frame loop starts either way -- a face that waits on a network
// read to draw ANYTHING is a face that looks broken on a slow disk.
loadSource(() => { build(); });
requestAnimationFrame(frame);
</script>
<!-- After the face, because the HUD measures the chrome the face draws. -->
<script src="../_shared/hud.js"></script>
</body>
</html>
