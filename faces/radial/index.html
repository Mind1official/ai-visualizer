<style>

<body>
<canvas id="stage"></canvas>
<div id="activity-panel" class="hud-panel"></div>
<div id="transcript-panel" class="hud-panel"></div>
<div id="usage-gauge"></div>
<div id="context-gauge"></div>
<div id="health-gauge"></div>
<script src="../../core.js"></script>
<script>
"use strict";
/* ============================================================
   THE RADIAL  ·  the starburst
   A full radial starburst of 80 spectrum bars around a living
   particle orb: thousands of green grains forming a ball that
   rotates, churns, and DETONATES from the core with every
   syllable. Around it: particles bursting off rising peaks, a
   connecting polygon web, concentric frequency rings, a pulse
   ring, a drifting star-and-nebula galaxy behind everything.

   idle       sonar ripples, a radar scanner arc, twinkling
              constellation stars — alive, never frozen
   listening / thinking
              an amber data-tick wheel + rotating HUD arcs
   speaking   the starburst erupts on the live waveform and the
              orb explodes from the inside, per syllable
   alert      red pulsing rings + vignette
   Keys: F = fullscreen.
   ============================================================ */

const Q=new URLSearchParams(location.search);
const SHOT=Q.get("shot");
AV.init({mic:true});
AV.ready(a=>{document.title=a.name+" Radial";});

const NUM_BARS=80;
const BG="#0a0507";
const BAR_COLORS=[[74,8,24],[120,10,36],[182,2,50],[224,40,80],[255,90,120],[255,170,180]];
const SMOOTHING=.3, GRAVITY=.92;
const SENSITIVITY=.55;
const MAX_PARTICLES=300, SPAWN_THRESHOLD=.6;
const ALERT_INNER=[255,30,20], ALERT_OUTER=[200,10,10];

const cv=document.getElementById("stage"), ctx=cv.getContext("2d");
let W=0,H=0;

/* ---------------- spectrum from the bus waveform ----------------
   The bus carries a 64-sample waveform snapshot. A tiny DFT turns it
   into 32 magnitude bins; the bars log-map across them so lows and
   highs land on different spokes, the way a real spectrum does. */
const mags=new Float32Array(32);
const barMax=new Float32Array(NUM_BARS).fill(1);
const bandMax=[1,1,1];
let bassE=0,midE=0,highE=0;
/* MUSIC MODE (backtalk music.py -> .voice_music -> AV.music/AV.bands):
   the song drives the starburst instead of Janus's voice. The bus only
   refreshes ~8x a second, so the 32 bands are eased toward each reading
   rather than snapped, or the bars would step. She takes the starburst
   back whenever she is talking or thinking. */
const musicMags=new Float32Array(32);
let musicT=0;
function musicLive(){
  return AV.music&&AV.state!=="speaking"&&AV.state!=="thinking";
}
function spectrum(){
  if(musicLive()){
    const b=AV.bands||[];
    for(let k=0;k<32;k++){
      const t=b[k]||0;
      musicMags[k]+=(t-musicMags[k])*(t>musicMags[k]?.55:.18);
      mags[k]=musicMags[k];
    }
    const band=(a,c)=>{let m=0;for(let k=a;k<c;k++)m+=mags[k];return m/(c-a)};
    bassE=bassE*.6+band(0,6)*.4;
    midE=midE*.7+band(6,18)*.3;
    highE=highE*.7+band(18,32)*.3;
    return;
  }
  const s=AV.rawSamples;
  if(!s){mags.fill(0);return}
  for(let k=1;k<=32;k++){
    let re=0,im=0;
    for(let n=0;n<64;n++){
      const a=6.2831853*k*n/64;
      const v=s[n]||0;
      re+=v*Math.cos(a);im-=v*Math.sin(a);
    }
    mags[k-1]=Math.hypot(re,im)/64;
  }
  const band=(a,b)=>{let m=0;for(let k=a;k<b;k++)m+=mags[k];return m/(b-a)};
  const vals=[band(0,5),band(5,15),band(15,32)];
  for(let i=0;i<3;i++){
    if(vals[i]>bandMax[i])bandMax[i]=vals[i];else bandMax[i]*=.999;
    const n=bandMax[i]>0?vals[i]/bandMax[i]:0;
    if(i===0)bassE=bassE*.7+n*.3;
    else if(i===1)midE=midE*.7+n*.3;
    else highE=highE*.7+n*.3;
  }
}
function barTargets(out){
  const logMax=Math.log(32);
  for(let i=0;i<NUM_BARS;i++){
    const k=Math.exp(i/(NUM_BARS-1)*logMax)-1;      // 0..31, log spaced
    const k0=Math.min(31,k|0), f=k-k0;
    let v=mags[k0]*(1-f)+mags[Math.min(31,k0+1)]*f;
    v*=1+(i/NUM_BARS)*4;                             // treble lift
    if(v>barMax[i])barMax[i]=v;else barMax[i]*=.999;
    out[i]=Math.min(1,(barMax[i]>0?v/barMax[i]:0)/SENSITIVITY);
  }
}

/* ---------------- the particle orb (the center piece) ----------------
   Thousands of grains forming a ball. Energy is internal pressure — it
   pushes grains outward FROM THE CENTER, hardest at the core, barely at
   the crust. Rising energy fires a blast transient that rebounds fast,
   so every syllable detonates. */
const ORB_N=6200;
const orb={};
function orbBuild(){
  const r32=(s=>{let a=s;return()=>{a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296}})(11);
  const gauss=()=>{let u=0,v=0;while(!u)u=r32();while(!v)v=r32();
    return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*v)};
  orb.dirs=new Float32Array(ORB_N*3);
  orb.r0=new Float32Array(ORB_N);
  orb.cols=new Uint8Array(ORB_N*3);
  orb.twP=new Float32Array(ORB_N);
  orb.twS=new Float32Array(ORB_N);
  const nShell=ORB_N*.65|0;
  for(let i=0;i<ORB_N;i++){
    let dx=gauss(),dy=gauss(),dz=gauss();
    const l=Math.hypot(dx,dy,dz)||1;
    orb.dirs[i*3]=dx/l;orb.dirs[i*3+1]=dy/l;orb.dirs[i*3+2]=dz/l;
    orb.r0[i]=i<nShell?Math.pow(.82+r32()*.18,.7)
                      :Math.pow(r32(),1/3)*.85;
    orb.twP[i]=r32()*6.2832;
    orb.twS[i]=.12+r32()*.33;         // slow organic shimmer
    // randomized vivid crimsons: every grain its own hue
    if(r32()<.10){orb.cols[i*3]=255;orb.cols[i*3+1]=225;orb.cols[i*3+2]=235}
    else{
      const h=.93+r32()*.06, s2=.82+r32()*.18, v2=.92+r32()*.08;
      const f=(n)=>{const k=(n+h*6)%6;
        return v2-v2*s2*Math.max(0,Math.min(k,4-k,1))};
      orb.cols[i*3]=f(5)*255;orb.cols[i*3+1]=f(3)*255;orb.cols[i*3+2]=f(1)*255;
    }
  }
  orb.rot=0;orb.blast=0;orb.envPrev=0;orb.push=0;orb.t=0;
  orb.S=0;
}
function orbRender(size,energy,breath,dt){
  const want=Math.max(64,size|0);
  if(orb.S<want){
    orb.S=(want*1.55|0)>>1<<1;
    orb.canvas=document.createElement("canvas");
    orb.canvas.width=orb.canvas.height=orb.S;
    orb.g=orb.canvas.getContext("2d");
    orb.img=orb.g.createImageData(orb.S,orb.S);
    orb.touched=new Int32Array(orb.S*orb.S);
    orb.touchedN=0;
    orb.b4=document.createElement("canvas");
    orb.b4.width=orb.b4.height=orb.S>>2;
  }
  const t=orb.t+=dt/1000;
  orb.rot+=(0.24+1.2*energy)*dt/1000;
  const rising=energy-orb.envPrev;
  orb.envPrev=energy;
  if(rising>.03&&energy>.20)orb.blast=Math.min(1.25,orb.blast+rising*5);
  orb.blast=Math.max(0,orb.blast-dt/1000*3.2);
  const pushTarget=.5*energy+1.15*orb.blast;
  orb.push+=(pushTarget-orb.push)*Math.min(1,dt/45);
  const push=orb.push;
  const S=orb.S,c=S/2,R=(want/2)*.92;
  const cy_=Math.cos(orb.rot),sy=Math.sin(orb.rot);
  const wob=.18*Math.sin(t*.23);
  const cx_=Math.cos(wob),sx=Math.sin(wob);
  const d=orb.img.data;
  for(let k2=0;k2<orb.touchedN;k2++){
    const i=orb.touched[k2];
    d[i]=0;d[i+1]=0;d[i+2]=0;d[i+3]=0;
  }
  orb.touchedN=0;
  for(let i=0;i<ORB_N;i++){
    const r0=orb.r0[i];
    // radial displacement: core grains fly, crust holds (clamped bulge)
    const rd=Math.min(r0+push*Math.pow(1-r0,1.2)+.18*push,1.48);
    const x=orb.dirs[i*3]*rd,y=orb.dirs[i*3+1]*rd,z=orb.dirs[i*3+2]*rd;
    const x2=x*cy_+z*sy, z2=-x*sy+z*cy_;
    const y2=y*cx_-z2*sx, z3=y*sx+z2*cx_;
    const xf=c+x2*R, yf=c+y2*R*.97;
    const depth=.38+.62*(z3+1)/2;
    const tw=.80+.20*Math.sin(t*orb.twS[i]+orb.twP[i]);
    const coreFlash=1+orb.blast*2.2*(1-r0);       // the core flashes white-hot
    const bright=Math.min(depth*tw*coreFlash*(1.18+.85*energy+.20*breath),2.1)*3.5;
    const r=Math.min(255,orb.cols[i*3]*bright);
    const g=Math.min(255,orb.cols[i*3+1]*bright);
    const b=Math.min(255,orb.cols[i*3+2]*bright);
    // bilinear splat: each grain spreads over its 4 neighbor pixels by
    // its true sub-pixel position — motion is continuous, zero snapping
    const x0=xf|0,y0=yf|0;
    if(x0<0||x0>=S-1||y0<0||y0>=S-1)continue;
    const fx=xf-x0,fy=yf-y0;
    const w00=(1-fx)*(1-fy),w10=fx*(1-fy),w01=(1-fx)*fy,w11=fx*fy;
    for(const[xo,yo,wgt]of[[0,0,w00],[1,0,w10],[0,1,w01],[1,1,w11]]){
      const idx=((y0+yo)*S+(x0+xo))*4;
      if(d[idx+3]===0){orb.touched[orb.touchedN++]=idx;d[idx+3]=255}
      d[idx]=Math.min(255,d[idx]+r*wgt);
      d[idx+1]=Math.min(255,d[idx+1]+g*wgt);
      d[idx+2]=Math.min(255,d[idx+2]+b*wgt);
    }
  }
  orb.g.putImageData(orb.img,0,0);
  // bloom: one downscale tap added twice (the second dimmed)
  const g4=orb.b4.getContext("2d");
  g4.clearRect(0,0,orb.b4.width,orb.b4.height);
  g4.drawImage(orb.canvas,0,0,orb.b4.width,orb.b4.height);
  orb.g.globalCompositeOperation="lighter";
  orb.g.drawImage(orb.b4,0,0,S,S);
  orb.g.globalAlpha=.43;
  orb.g.drawImage(orb.b4,0,0,S,S);
  orb.g.globalAlpha=1;
  orb.g.globalCompositeOperation="source-over";
  return orb.canvas;
}

/* ---------------- particles ---------------- */
const particles=[];
function spawnParticles(x,y,angle,color,count){
  for(let i=0;i<count;i++){
    if(particles.length>=MAX_PARTICLES)return;
    const a=angle+(Math.random()-.5)*.6;
    const spd=(1.5+Math.random()*2.5)*(0.5+Math.random());
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      life:30+Math.random()*40|0,maxLife:0,color,
      size:1.5+Math.random()*2});
  }
}
function drawParticles(dt60){
  for(const p of particles){
    if(!p.maxLife)p.maxLife=p.life;
    p.x+=p.vx*dt60;p.y+=p.vy*dt60;
    p.vx*=Math.pow(.97,dt60);p.vy*=Math.pow(.97,dt60);
    p.life-=dt60;
    const k=Math.max(0,p.life/p.maxLife);
    const size=Math.max(1,p.size*k);
    ctx.globalAlpha=k;
    ctx.fillStyle=`rgb(${p.color[0]},${p.color[1]},${p.color[2]})`;
    ctx.beginPath();ctx.arc(p.x,p.y,size,0,6.29);ctx.fill();
    ctx.globalAlpha=k*.25;
    ctx.beginPath();ctx.arc(p.x,p.y,size*2,0,6.29);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(let i=particles.length-1;i>=0;i--)
    if(particles[i].life<=0)particles.splice(i,1);
}

/* ---------------- galaxy backdrop ---------------- */
let nebula=null;
const stars=[];
function buildGalaxy(){
  nebula=document.createElement("canvas");
  nebula.width=W;nebula.height=H;
  const g=nebula.getContext("2d");
  const colors=[[62,10,24],[50,8,22],[34,10,20],[74,16,30],[30,6,14],[56,12,26]];
  for(let i=0;i<35;i++){
    const bx=Math.random()*W,by=Math.random()*H;
    const col=colors[Math.random()*colors.length|0];
    const maxR=80+Math.random()*200;
    const grd=g.createRadialGradient(bx,by,0,bx,by,maxR);
    grd.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},.16)`);
    grd.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=grd;
    g.beginPath();g.arc(bx,by,maxR,0,6.29);g.fill();
  }
  stars.length=0;
  for(let i=0;i<300;i++){
    stars.push({x:Math.random()*(W+200),y:Math.random()*(H+200),
      b:40+Math.random()*160,
      size:[1,1,1,2,2,3][Math.random()*6|0],
      ts:.02+Math.random()*.06,tp:Math.random()*6.2832});
  }
}
let galX=0,galY=0;
function drawGalaxy(dt60){
  galX+=.15*dt60;galY+=.08*dt60;
  ctx.drawImage(nebula,0,0);
  for(const s of stars){
    s.tp+=s.ts*dt60;
    const tw=.6+.4*Math.sin(s.tp);
    const par=.5+s.size*.3;
    const x=((s.x-galX*par)%(W+200)+(W+200))%(W+200)-100;
    const y=((s.y-galY*par)%(H+200)+(H+200))%(H+200)-100;
    if(x<-10||x>W+10||y<-10||y>H+10)continue;
    const b=Math.max(20,Math.min(255,s.b*tw))|0;
    ctx.fillStyle=`rgb(${b},${b},${Math.min(255,b+25)})`;
    if(s.size<=1)ctx.fillRect(x,y,1,1);
    else{
      ctx.beginPath();ctx.arc(x,y,s.size,0,6.29);ctx.fill();
      if(s.size>=3){
        ctx.globalAlpha=.12;
        ctx.beginPath();ctx.arc(x,y,s.size*3,0,6.29);ctx.fill();
        ctx.globalAlpha=1;
      }
    }
  }
}

/* ---------------- idle + working ornaments ---------------- */
const ripples=[];let rippleCool=0;
function drawSonar(cxp,cyp,innerR,maxLen,dt60){
  if(--rippleCool<=0){
    ripples.push([innerR*1.15,110]);
    rippleCool=150+Math.random()*90|0;
  }
  const maxR=innerR+maxLen;
  for(const rp of ripples){
    rp[0]+=1.6*dt60;rp[1]-=.55*dt60;
    if(rp[1]>0&&rp[0]<maxR*1.1){
      ctx.strokeStyle=`rgba(224,40,80,${rp[1]/255})`;
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(cxp,cyp,rp[0],0,6.29);ctx.stroke();
    }
  }
  for(let i=ripples.length-1;i>=0;i--)
    if(ripples[i][1]<=0||ripples[i][0]>=maxR*1.1)ripples.splice(i,1);
}

let scanA=0;
function drawScanner(cxp,cyp,innerR,fade,dt60){
  scanA+=(2*Math.PI/(60*6))*dt60;
  if(fade<.01)return;
  const radius=innerR*1.45;
  const span=Math.PI*.75, segs=44;
  for(let i=0;i<segs;i++){
    const t=i/(segs-1);
    const a=scanA-span*(1-t);
    const alpha=t*t*fade*.86;
    if(alpha<=0)continue;
    ctx.fillStyle=`rgba(255,140,170,${alpha})`;
    ctx.beginPath();
    ctx.arc(cxp+Math.cos(a)*radius,cyp+Math.sin(a)*radius,
            Math.max(1,1+t*3),0,6.29);
    ctx.fill();
  }
  const hx=cxp+Math.cos(scanA)*radius, hy=cyp+Math.sin(scanA)*radius;
  for(let i=4;i>0;i--){
    ctx.fillStyle=`rgba(255,190,210,${fade/(i+2)})`;
    ctx.beginPath();ctx.arc(hx,hy,4+i*3,0,6.29);ctx.fill();
  }
  ctx.fillStyle=`rgba(255,235,240,${fade})`;
  ctx.beginPath();ctx.arc(hx,hy,4,0,6.29);ctx.fill();
}

const constel=[];
function buildConstellation(){
  constel.length=0;
  const cols=[[255,150,180],[255,205,220],[224,40,80],[255,90,120]];
  for(let i=0;i<22;i++){
    constel.push({angle:Math.random()*6.2832,rf:1.45+Math.random()*1.1,
      drift:(Math.random()-.5)*.0024,
      size:[1,1,2,2,2,3][Math.random()*6|0],
      ba:90+Math.random()*110|0,
      ts:.015+Math.random()*.03,tp:Math.random()*6.2832,
      color:cols[Math.random()*cols.length|0]});
  }
}
function drawConstellation(cxp,cyp,innerR,fade,dt60){
  for(const s of constel){s.angle+=s.drift*dt60;s.tp+=s.ts*dt60}
  if(fade<.01)return;
  for(const s of constel){
    const r=innerR*s.rf;
    const x=cxp+Math.cos(s.angle)*r, y=cyp+Math.sin(s.angle)*r;
    const pulse=.35+.65*(.5+.5*Math.sin(s.tp));
    const a=s.ba*pulse*fade/255;
    if(a<=0)continue;
    const[cr,cg,cb]=s.color;
    for(let i=3;i>0;i--){
      ctx.fillStyle=`rgba(${cr},${cg},${cb},${a/(i+1)})`;
      ctx.beginPath();ctx.arc(x,y,s.size+i,0,6.29);ctx.fill();
    }
    ctx.fillStyle=`rgba(${cr},${cg},${cb},${a})`;
    ctx.beginPath();ctx.arc(x,y,s.size,0,6.29);ctx.fill();
  }
}

let hudPhase=0;
function drawTicks(cxp,cyp,innerR,fade,dt60){
  hudPhase+=.08*dt60;
  if(fade<.01)return;
  const ringR=innerR*1.25, num=48, rotation=hudPhase*.35;
  const baseLen=innerR*.10;
  ctx.strokeStyle=`rgba(255,180,60,${.86*fade})`;
  ctx.lineWidth=2;
  for(let i=0;i<num;i++){
    const a=(i/num)*6.2832+rotation;
    const wob=Math.sin(hudPhase*1.4+i*.7);
    const len=baseLen*(.55+.45*(wob*.5+.5));
    const r1=ringR-len*.5,r2=ringR+len*.5;
    ctx.beginPath();
    ctx.moveTo(cxp+Math.cos(a)*r1,cyp+Math.sin(a)*r1);
    ctx.lineTo(cxp+Math.cos(a)*r2,cyp+Math.sin(a)*r2);
    ctx.stroke();
  }
}
function drawHudArcs(cxp,cyp,innerR,fade){
  if(fade<.01)return;
  const specs=[[1.18,1,Math.PI*1.1,[255,200,90]],
               [1.32,-.7,Math.PI*.9,[255,140,30]],
               [1.46,.5,Math.PI*1.25,[255,170,60]]];
  specs.forEach(([rf,spin,span,color],i)=>{
    const start=hudPhase*spin+i*1.1;
    const radius=innerR*rf, segs=32;
    for(let j=0;j<segs;j++){
      const t=j/(segs-1);
      const a=start+span*t;
      const alpha=.86*Math.sin(Math.PI*t)*fade;
      if(alpha<=0)continue;
      ctx.fillStyle=`rgba(${color[0]},${color[1]},${color[2]},${alpha})`;
      ctx.beginPath();
      ctx.arc(cxp+Math.cos(a)*radius,cyp+Math.sin(a)*radius,2,0,6.29);
      ctx.fill();
    }
  });
}

/* ---------------- bars + rings ---------------- */
const barH=new Float32Array(NUM_BARS);
const peakH=new Float32Array(NUM_BARS);
const prevH=new Float32Array(NUM_BARS);
const targets=new Float32Array(NUM_BARS);
let pulseR=0;
function colorFor(h){
  const idx=h*(BAR_COLORS.length-1);
  const lo=idx|0, hi=Math.min(lo+1,BAR_COLORS.length-1), f=idx-lo;
  return[BAR_COLORS[lo][0]+(BAR_COLORS[hi][0]-BAR_COLORS[lo][0])*f|0,
         BAR_COLORS[lo][1]+(BAR_COLORS[hi][1]-BAR_COLORS[lo][1])*f|0,
         BAR_COLORS[lo][2]+(BAR_COLORS[hi][2]-BAR_COLORS[lo][2])*f|0];
}
function drawRings(cxp,cyp,innerR,maxLen){
  const rings=[[bassE,innerR+maxLen*.25,[120,10,36]],
               [midE,innerR+maxLen*.50,[182,2,50]],
               [highE,innerR+maxLen*.75,[255,90,120]]];
  for(const[e,baseR,col]of rings){
    if(e<.05)continue;
    ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},${Math.min(1,e*.7)})`;
    ctx.lineWidth=Math.max(1,e*4);
    ctx.beginPath();ctx.arc(cxp,cyp,baseR+e*15,0,6.29);ctx.stroke();
  }
}
function drawPulse(cxp,cyp,innerR){
  const overall=(bassE+midE+highE)/3;
  const target=innerR+overall*40;
  pulseR+=(target-pulseR)*.15;
  if(overall>.05){
    const alpha=Math.min(.78,overall*1.18);
    ctx.strokeStyle=`rgba(224,40,80,${alpha/3})`;
    ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(cxp,cyp,pulseR+8,0,6.29);ctx.stroke();
    ctx.strokeStyle=`rgba(255,170,180,${alpha})`;
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cxp,cyp,pulseR,0,6.29);ctx.stroke();
  }
}

/* ---------------- alert ---------------- */
let alertPhase=0;
function drawAlert(cxp,cyp,innerR,dt60){
  alertPhase+=.08*dt60;
  const pulse=.65+.35*Math.sin(alertPhase);
  const[r1,g1,b1]=ALERT_INNER;
  ctx.strokeStyle=`rgba(${r1},${g1},${b1},${.78*pulse})`;
  ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(cxp,cyp,innerR+12,0,6.29);ctx.stroke();
  ctx.strokeStyle=`rgba(${r1},${g1},${b1},${.39*pulse})`;
  ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cxp,cyp,innerR+20,0,6.29);ctx.stroke();
  const[r2,g2,b2]=ALERT_OUTER;
  ctx.strokeStyle=`rgba(${r2},${g2},${b2},${.47*pulse})`;
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(cxp,cyp,innerR+50+20*Math.sin(alertPhase*.7),0,6.29);ctx.stroke();
  ctx.fillStyle=`rgba(${r1},${g1},${b1},${.1*pulse})`;
  ctx.fillRect(0,0,W,H);
}

/* ---------------- state fades + orb gate ---------------- */
let rotation=0, idleFade=0, workingFade=0, breathPhase=0;
let imgEnergy=0, orbEnergy=0, noiseFloor=.05, gateOpen=false, gateT0=null;
let orbFont=null;

function frame(dt){
  AV.tick(dt);
  const dt60=Math.min(3,dt/16.667);
  spectrum();
  barTargets(targets);

  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  drawGalaxy(dt60);

  for(let i=0;i<NUM_BARS;i++){
    if(targets[i]>barH[i])barH[i]=barH[i]*SMOOTHING+targets[i]*(1-SMOOTHING);
    else barH[i]*=Math.pow(GRAVITY,dt60);
    if(barH[i]>peakH[i])peakH[i]=barH[i];
    else peakH[i]*=Math.pow(.98,dt60);
  }

  const cxp=W>>1;
  const cyp=(activityPanel.offsetHeight+(H-transcriptPanel.offsetHeight))/2;
  const innerR=Math.min(cxp,cyp)*.42;
  // music mode eases in: longer bars, spin that follows the kick
  musicT+=((musicLive()?1:0)-musicT)*.05*Math.min(3,dt/16.667);
  const maxLen=Math.min(cxp,cyp)*(.65+.17*musicT);
  rotation+=(.002+.010*musicT*bassE)*dt60;

  /* state-driven fades: speaking = both off (bars + halo own the motion),
     listening/thinking = working ornaments, idle = idle ornaments */
  const st=AV.state;
  let idleT=0,workT=0;
  if(st==="speaking"||musicLive()){idleT=0;workT=0}
  else if(st==="listening"||st==="thinking"){idleT=0;workT=1}
  else{idleT=1;workT=0}
  const ease=(cur,tg,up)=>cur+(tg-cur)*(tg>cur?up:.30)*dt60;
  idleFade=ease(idleFade,idleT,.08);
  workingFade=ease(workingFade,workT,.12);
  if(idleT>.5)drawSonar(cxp,cyp,innerR,maxLen,dt60);

  drawRings(cxp,cyp,innerR,maxLen);

  /* orb energy: smart gate learns the ambient floor so quiet hum can
     never vibrate the orb; speech opens it with hysteresis */
  let overall=(bassE+midE+highE)/3;
  overall=Math.sqrt(Math.max(0,overall));
  imgEnergy=imgEnergy*.55+overall*.45;
  if(gateT0===null)gateT0=performance.now();
  if(performance.now()-gateT0<3000)
    noiseFloor=Math.max(noiseFloor,Math.min(overall*.95,.20));
  else if(overall<noiseFloor)noiseFloor=overall;
  else noiseFloor=Math.min(noiseFloor*1.004+.0002,.35);
  const thOpen=noiseFloor*2.2+.05, thClose=noiseFloor*1.5+.03;
  gateOpen=gateOpen?overall>thClose:overall>thOpen;
  const boost=gateOpen?Math.min(1,(overall-thClose)*2.2):0;
  if(boost>orbEnergy)orbEnergy=boost;
  else orbEnergy=Math.max(0,orbEnergy-.045*dt60);

  breathPhase+=(2*Math.PI/(60*8))*dt60;
  const breath=.5+.5*Math.sin(breathPhase);

  const baseSize=innerR*1.9|0;
  const orbSurf=orbRender(baseSize,orbEnergy,breath,dt);

  // always-on breathing halo — faint, never off
  {
    const a=(20+40*breath)/255;
    const r=baseSize*.55+breath*18;
    for(let i=5;i>0;i--){
      ctx.fillStyle=`rgba(182,20,55,${a/(i+1)})`;
      ctx.beginPath();ctx.arc(cxp,cyp,r+i*14,0,6.29);ctx.fill();
    }
  }
  // audio halo — intensifies with the voice
  if(imgEnergy>.02){
    const a=Math.min(.78,imgEnergy*1.57);
    const r=baseSize*.6+imgEnergy*60;
    for(let i=6;i>0;i--){
      ctx.fillStyle=`rgba(182,20,55,${a/(i+1)})`;
      ctx.beginPath();ctx.arc(cxp,cyp,r+i*16,0,6.29);ctx.fill();
    }
  }

  // idle-only movement: radar scanner + twinkling constellation
  drawScanner(cxp,cyp,innerR,idleFade,dt60);
  drawConstellation(cxp,cyp,innerR,idleFade,dt60);
  // working-state movement: data-tick wheel + HUD arcs
  drawTicks(cxp,cyp,innerR,workingFade,dt60);
  drawHudArcs(cxp,cyp,innerR,workingFade);

  /* ---- the starburst ---- */
  const thickness=Math.max(3,5*Math.min(W,H)/1200|0);
  const tips=[];
  for(let i=0;i<NUM_BARS;i++){
    const angle=(i/NUM_BARS)*6.2832-Math.PI/2+rotation;
    const barLen=barH[i]*maxLen, peakLen=peakH[i]*maxLen;
    const ca=Math.cos(angle),sa=Math.sin(angle);
    const x1=cxp+ca*innerR, y1=cyp+sa*innerR;
    const x2=cxp+ca*(innerR+barLen), y2=cyp+sa*(innerR+barLen);
    tips.push([x2,y2]);
    if(barH[i]<.02)continue;
    const col=colorFor(barH[i]);
    ctx.strokeStyle=`rgb(${col[0]},${col[1]},${col[2]})`;
    ctx.lineWidth=thickness;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    // glow pass
    ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},.14)`;
    ctx.lineWidth=thickness*5;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    // peak dot
    if(peakLen>barLen+4){
      ctx.fillStyle="rgb(255,170,180)";
      ctx.beginPath();
      ctx.arc(cxp+ca*(innerR+peakLen),cyp+sa*(innerR+peakLen),
              Math.max(2,thickness>>1),0,6.29);
      ctx.fill();
    }
    if(barH[i]>SPAWN_THRESHOLD&&barH[i]>prevH[i]+.05)
      spawnParticles(x2,y2,angle,col,1+(Math.random()*3|0));
  }
  prevH.set(barH);

  /* connecting polygon web */
  for(let i=0;i<tips.length;i++){
    const j=(i+1)%tips.length;
    const dx=(tips[i][0]+tips[j][0])/2-cxp, dy=(tips[i][1]+tips[j][1])/2-cyp;
    const nd=Math.min(1,(Math.hypot(dx,dy)-innerR)/maxLen);
    const col=colorFor(Math.max(0,nd));
    ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},${(30+Math.max(0,nd)*80)/255})`;
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(tips[i][0],tips[i][1]);
    ctx.lineTo(tips[j][0],tips[j][1]);ctx.stroke();
  }

  drawParticles(dt60);
  drawPulse(cxp,cyp,innerR);

  /* the orb in FRONT of everything starburst-related */
  {
    const S=orb.S;
    const half=S/2;
    ctx.fillStyle="rgb(12,4,6)";
    ctx.beginPath();ctx.arc(cxp,cyp,S*.44/1.55,0,6.29);ctx.fill();
    ctx.globalCompositeOperation="lighter";
    ctx.drawImage(orbSurf,cxp-half,cyp-half);
    ctx.globalCompositeOperation="source-over";
    const rRing=S*.50/1.55;                       // canvas is 1.55x the orb
    ctx.strokeStyle="rgb(150,30,60)";ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cxp,cyp,rRing,0,6.29);ctx.stroke();
    ctx.strokeStyle="rgb(107,30,55)";
    ctx.beginPath();ctx.arc(cxp,cyp,rRing*1.10,0,6.29);ctx.stroke();
    ctx.strokeStyle="rgb(165,40,70)";
    for(let i=0;i<36;i++){
      const a=i*10*Math.PI/180;
      const r1=rRing*1.10, r2=rRing*(i%3===0?1.14:1.12);
      ctx.beginPath();
      ctx.moveTo(cxp+Math.cos(a)*r1,cyp+Math.sin(a)*r1);
      ctx.lineTo(cxp+Math.cos(a)*r2,cyp+Math.sin(a)*r2);
      ctx.stroke();
    }
    if(!orbFont)orbFont="10px 'SF Mono',Menlo,Consolas,monospace";
    ctx.font=orbFont;ctx.fillStyle="rgb(220,60,100)";
    ctx.textAlign="center";ctx.textBaseline="middle";
    for(const[txt,ang]of[["NEURAL NET",-60],["SYS LINK",30],["CORE 01",120],["AUX FEED",210]]){
      const a=ang*Math.PI/180;
      ctx.fillText(txt,cxp+Math.cos(a)*rRing*1.22,cyp+Math.sin(a)*rRing*1.22);
    }
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
  }

  drawMeters(AV.state,AV.env);

  if(AV.answerOnly)drawAnswerOnly(cxp,cyp);
  if(AV.alert)drawAlert(cxp,cyp,innerR,dt60);
  if(AV.compacting)drawCompacting(cxp,cyp,innerR);
  document.body.classList.toggle("music",!!AV.music);
  if(musicT>.02)drawMusicTag();
}

/* ANSWER ONLY MODE: one quiet line under the dial. The gate is
   invisible otherwise, and a mic that ignores you looks identical to a
   mic that is broken -- so the face says which one it is. Sits below the
   orb ring labels (rRing*1.22), so it never collides with them. */
function drawAnswerOnly(cxp,cyp){
  const rRing=orb.S*.50/1.55;
  ctx.save();
  ctx.font="600 11px 'SF Mono',Menlo,Consolas,monospace";
  ctx.fillStyle="rgb(220,60,100)";
  ctx.shadowColor="rgba(255,45,90,.6)";ctx.shadowBlur=6;
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("ANSWER ONLY MODE",cxp,cyp+rRing*1.42);
  ctx.restore();
}

/* The "MUSIC MODE" tag, bottom centre, pulsing with the kick. It sits in
   the transcript panel's spot, which music mode fades out (body.music),
   so it never fights the chat for the same pixels. */
function drawMusicTag(){
  ctx.save();
  const k=Math.min(1,bassE*1.4);
  ctx.globalAlpha=Math.min(1,musicT)*(.45+.55*k);
  ctx.font=`600 ${18+k*4|0}px 'SF Mono',Menlo,Consolas,monospace`;
  ctx.fillStyle="rgb(240,70,110)";
  ctx.shadowColor="rgba(255,45,90,.9)";ctx.shadowBlur=8+k*22;
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("M U S I C   M O D E",W/2,H-42);
  ctx.restore();
}

/* How much of the bottom edge the transcript panel is covering. Canvas
   chrome (the usage rows, the meters) is painted UNDER that panel's
   z-index, so anything drawn at H-16 is simply invisible behind it --
   the bug this measurement exists to fix. Mirrors cgPlace(), which
   solves the same problem for the context gauge. */
function chromeInset(){
  const p=document.getElementById("transcript-panel");
  return p?p.offsetHeight+10:0;
}

/* The mirror of chromeInset() for the top edge: how much of it the
   activity panel is covering, so canvas chrome can clear it. */
function topInset(){
  const p=document.getElementById("activity-panel");
  return p?p.offsetHeight:0;
}

/* MIC IN / AUDIO OUT bar meters, ported from the Neural face so the
   radial face also shows Mind's own voice while he talks -- AV.micLevel
   is live browser mic capture (AV.init mic:true), AV.env is Janus's
   output envelope. Re-themed crimson; Neural's amber/cyan would fight
   the palette. */
let micHist=[],outHist=[];
function drawMeters(state,env){
  const inset=chromeInset();
  const by=H-46-inset, n=46, bw=3, gap=4, h=22;
  micHist.push(state==="listening"?AV.micLevel:AV.micLevel*.25);
  micHist=micHist.slice(-n);
  outHist.push(env);outHist=outHist.slice(-n);
  ctx.save();
  ctx.font="10px 'SF Mono',Menlo,Consolas,monospace";
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  const live=state==="listening", out=state==="speaking";
  ctx.fillStyle=live?"rgb(255,150,175)":"rgba(255,190,205,.45)";
  ctx.fillText("MIC IN",28,by-16);
  for(let i=0;i<micHist.length;i++){
    const bh=Math.max(1,micHist[i]*h|0);
    ctx.fillStyle=live?"rgb(224,20,76)":"rgba(182,2,50,.5)";
    ctx.fillRect(28+i*gap,by+h-bh,bw,bh);
  }
  const ox=W-28-n*gap;
  ctx.fillStyle=out?"rgb(255,150,175)":"rgba(255,190,205,.45)";
  ctx.fillText("AUDIO OUT",ox,by-16);
  for(let i=0;i<outHist.length;i++){
    const bh=Math.max(1,outHist[i]*h|0);
    ctx.fillStyle=out?"rgb(255,90,120)":"rgba(182,2,50,.5)";
    ctx.fillRect(ox+i*gap,by+h-bh,bw,bh);
  }
  ctx.restore();
}

/* ---------------- compaction ----------------
   Runs while Claude Code folds the context window down (PreCompact hook
   -> .voice_compacting -> AV.compacting). Three rings collapse inward to
   the orb and a label pulses underneath: the whole point is that Mind can
   tell at a glance that the pause is compaction and not a hang. Purely
   time-driven, so it never needs state of its own. */
function drawCompacting(cx,cy,innerR){
  const t=performance.now()/1000;
  const outer=innerR*2.7, inner=innerR*0.55;
  ctx.save();
  for(let i=0;i<3;i++){
    const k=(t*0.55+i/3)%1;                 /* 0 outside -> 1 collapsed */
    const r=outer-(outer-inner)*k;
    const a=Math.sin(k*Math.PI)*0.7;         /* fade in and back out */
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,120,155,${a.toFixed(3)})`;
    ctx.lineWidth=2;
    ctx.setLineDash([14,10]);
    ctx.lineDashOffset=-t*40;
    ctx.stroke();
  }
  ctx.setLineDash([]);
  /* a sweeping arc, so the collapse reads as work in progress */
  ctx.beginPath();
  ctx.arc(cx,cy,outer*0.92,t*2.2,t*2.2+0.9);
  ctx.strokeStyle="rgba(224,20,76,.85)";ctx.lineWidth=3;ctx.stroke();
  const pulse=0.55+0.45*Math.sin(t*3.4);
  ctx.font="12px 'SF Mono',Menlo,Consolas,monospace";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle=`rgba(255,190,205,${pulse.toFixed(3)})`;
  /* ABOVE the orb, not below: the transcript panel owns the bottom edge
     and swallowed this label whole. Clamped under the activity panel so
     it can't hide behind the top edge's chrome either. */
  ctx.fillText("COMPACTING CONTEXT",cx,
    Math.max(topInset()+14,cy-outer*0.92-22));
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.restore();
}

function resize(){
  W=cv.width=innerWidth;H=cv.height=innerHeight;
  buildGalaxy();buildConstellation();
}
orbBuild();
addEventListener("resize",resize);
resize();

addEventListener("keydown",e=>{
  if(e.key==="f"||e.key==="F"){
    document.fullscreenElement?document.exitFullscreen()
      :document.documentElement.requestFullscreen();
  }
});

/* ---------------- activity + transcript panels ----------------
   Top: a live readout of what Janus is doing (one line per tool call,
   from a Claude Code PreToolUse hook). Bottom: the conversation itself
   (UserPromptSubmit + Stop hooks). Both are plain log tails served by
   server.py from files the hooks append to -- polled, not pushed, so
   this stays a dumb reader with no state of its own. */
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const activityPanel=document.getElementById("activity-panel");
const transcriptPanel=document.getElementById("transcript-panel");
let actTs=0,actText="";
function fmtElapsed(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const m=Math.floor(s/60),r=s%60;
  return m>0?`${m}:${String(r).padStart(2,"0")}`:`${r}s`;
}
function renderActivity(){
  if(!actText){activityPanel.innerHTML="";return}
  const t=fmtElapsed(Date.now()-actTs);
  activityPanel.innerHTML=`<div class="line">${esc(actText)} <span class="t">${t}</span></div>`;
}
async function pollLog(url,el,isTranscript){
  let lines;
  try{
    const r=await fetch(url,{cache:"no-store"});
    lines=(await r.json()).lines||[];
  }catch(e){return}
  if(!isTranscript){
    const last=lines[lines.length-1]||"";
    const bar=last.indexOf("|");
    if(bar<0){actTs=0;actText=last}
    else{
      const ts=parseInt(last.slice(0,bar),10);
      const text=last.slice(bar+1);
      if(text==="__IDLE__"){actTs=0;actText=""}
      else if(ts!==actTs){actTs=ts;actText=text}
    }
    renderActivity();
    return;
  }
  const atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight-4;
  el.innerHTML=lines.map(l=>{
    let cls="line";
    /* Speaker-agnostic: the assistant's tag is its CONFIGURED name
       (backtalk's `name`), not the literal "JANUS" this used to match --
       so a renamed agent's lines simply lost their styling. Anything
       tagged and not the user is the assistant; there are only two. */
    if(l.startsWith("YOU: "))cls="line you";
    else if(/^[^:]{1,24}: /.test(l))cls="line janus";
    return `<div class="${cls}">${esc(l)}</div>`;
  }).join("");
  if(atBottom)el.scrollTop=el.scrollHeight;
}
/* ---------------- context gauge ----------------
   How full Janus's context window is, served by server.py from the
   voice line's .voice_context signal. A semicircle arc for the fill,
   the real token counts under it, and a stacked bar showing where the
   window actually went. Polled every 5s, not every second: the numbers
   only change when a turn completes. Absent signal = panel stays
   hidden, so a face with no voice line behind it looks deliberate
   rather than broken. */
const cgEl=document.getElementById("context-gauge");
const CG_R=46,CG_LEN=Math.PI*CG_R;          /* semicircle arc length */
const CG_COLORS=["#B60232","#E0144C","#FF4D74","#FF8AA6","#FFC2D1"];
function cgTok(n){
  if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M";
  if(n>=1e3)return (n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,"")+"k";
  return String(n);
}
function cgPlace(){
  /* A panel the user has DRAGGED owns its own position -- re-pinning its
     bottom edge here would set top and bottom at once and stretch the box.
     core.js sets this flag when it parks one, and clears it on reset. */
  if(cgEl.dataset.avParked){ugPlace();return}
  /* ride directly on top of the transcript panel, whatever its height */
  cgEl.style.bottom=(transcriptPanel.offsetHeight+20)+"px";
  ugPlace();
}

/* ---------------- plan usage ----------------
   The 5h and 7d rate-limit windows, stacked directly above the context
   gauge. Same source as every other face (AV.util.usageRows), so they
   cannot disagree about the same number, and hidden entirely when the
   voice line publishes no usage. */
const ugEl=document.getElementById("usage-gauge");
function ugPlace(){
  if(ugEl.dataset.avParked)return;
  /* sit on the gauge when it is up, on the transcript when it is not */
  const base=transcriptPanel.offsetHeight+20;
  ugEl.style.bottom=(cgEl.classList.contains("on")
    ? base+cgEl.offsetHeight+8 : base)+"px";
}
function ugRender(){
  const rows=AV.util.usageRows();
  if(!rows.length){ugEl.classList.remove("on");return}
  ugEl.innerHTML='<div class="ug-head">Plan usage</div>'+rows.map(r=>{
    /* usageRows packs "42%  resets in 3h" into one string; the bar wants
       the number and the row wants the reset separately. */
    const rel=r.text.split("  ").slice(1).join(" ").trim();
    const w=r.known?Math.max(2,Math.min(100,r.pct)):0;
    return `<div class="ug-row${r.hot?" hot":""}">`
      +`<b>${esc(r.label)}</b>`
      +`<span class="ug-track"><i style="width:${w}%"></i></span>`
      +`<em>${r.known?r.pct+"%":"—"}</em></div>`
      +(rel?`<div class="ug-reset">${esc(rel)}</div>`:"");
  }).join("");
  ugEl.classList.add("on");
  ugPlace();
}
function cgRender(d){
  if(!d||!d.total){cgEl.classList.remove("on");return}
  const pct=Math.max(0,Math.min(1,d.pct||0));
  const dash=(pct*CG_LEN).toFixed(1);
  const cats=(d.categories||[])
    .filter(c=>!/free|buffer/i.test(c.name)&&c.tokens>0)
    .sort((a,b)=>b.tokens-a.tokens).slice(0,5);
  const catTotal=cats.reduce((a,c)=>a+c.tokens,0)||1;
  const bar=cats.map((c,i)=>
    `<i style="width:${(c.tokens/catTotal*100).toFixed(2)}%;`
    +`background:${CG_COLORS[i%CG_COLORS.length]}"></i>`).join("");
  const legend=cats.slice(0,3).map((c,i)=>
    `<div><s style="background:${CG_COLORS[i%CG_COLORS.length]}"></s>`
    +`${esc(c.name)}<em>${cgTok(c.tokens)}</em></div>`).join("");
  cgEl.innerHTML=
    `<div class="cg-head"><span>Context</span><b>${cgTok(d.free)} free</b></div>`
    +`<svg class="cg-arc" width="110" height="62" viewBox="0 0 110 62">`
    +`<defs><linearGradient id="cgG" x1="0" y1="0" x2="1" y2="0">`
    +`<stop offset="0" stop-color="#FF8AA6"/>`
    +`<stop offset="1" stop-color="#B60232"/></linearGradient>`
    +`<filter id="cgGlow" x="-50%" y="-50%" width="200%" height="200%">`
    +`<feGaussianBlur stdDeviation="2.6" result="b"/>`
    +`<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>`
    +`</feMerge></filter></defs>`
    +`<path d="M9 55 A ${CG_R} ${CG_R} 0 0 1 101 55" fill="none"`
    +` stroke="rgba(255,190,205,.16)" stroke-width="8"`
    +` stroke-linecap="round"/>`
    +`<path d="M9 55 A ${CG_R} ${CG_R} 0 0 1 101 55" fill="none"`
    +` stroke="url(#cgG)" stroke-width="8" stroke-linecap="round"`
    +` filter="url(#cgGlow)"`
    +` stroke-dasharray="${dash} ${CG_LEN.toFixed(1)}"/>`
    +`<text class="cg-pct" x="55" y="50" text-anchor="middle">`
    +`${Math.round(pct*100)}<tspan class="cg-pct-u" dx="1">%</tspan></text>`
    +`</svg>`
    +`<div class="cg-nums"><span>${cgTok(d.used)} used</span>`
    +`<span class="sep">/</span><span>${cgTok(d.total)} window</span></div>`
    +(bar?`<div class="cg-bar">${bar}</div>`:"")
    +(legend?`<div class="cg-legend">${legend}</div>`:"");
  cgEl.classList.add("on");
  cgPlace();
}
/* ---------------- stack health ----------------
   tools/health.py writes .health every run; server.py serves it on /state
   as AV.health and sends NULL once it has missed two runs, so this panel
   vanishes rather than freezing at OK.

   Placement: bottom-left, sitting directly on top of the MIC IN meter,
   which is canvas chrome at a known offset rather than a DOM element --
   hence the constant instead of a measured height. */
const hgEl=document.getElementById("health-gauge");
const HG_MIC_H=74;      /* MIC IN label + bars + breathing room */
function hgPlace(){
  if(hgEl.dataset.avParked)return;
  hgEl.style.bottom=(chromeInset()+HG_MIC_H)+"px";
}
let hgSig="";
function hgRender(){
  const h=AV.health;
  if(!h){ hgEl.classList.remove("on"); hgSig=""; hgPlace(); return }
  /* Signature so the DOM is only rebuilt when something actually changed:
     this runs on a timer and the panel is mostly static. */
  const sig=JSON.stringify([h.verdict,h.up,h.total,h.idle,h.down,
                            Math.floor((h.age_s||0)/60),h.hist]);
  if(sig!==hgSig){
    hgSig=sig;
    const hist=Array.isArray(h.hist)?h.hist:[];
    /* The sparkline wants a fixed number of cells so the panel never
       resizes: pad the left with empty ones until history fills in. */
    const CELLS=24;
    const tail=hist.slice(-CELLS);
    const pad=CELLS-tail.length;
    let spark="";
    for(let i=0;i<pad;i++) spark+='<i class="gap" style="height:3px"></i>';
    for(const d of tail){
      /* Full height is clean. Each required thing missing takes a bite,
         floored so a bad run is still visible rather than a hairline. */
      const pct=Math.max(18,100-d*34);
      spark+=`<i class="${d?"bad":""}" style="height:${pct}%"></i>`;
    }
    const bad=h.verdict!=="ok";
    const word=bad?(h.down&&h.down.length?"DEGRADED":h.verdict.toUpperCase())
                  :"STACK OK";
    const mins=Math.floor((h.age_s||0)/60);
    const when=mins<1?"checked just now":`checked ${mins} min ago`;
    hgEl.innerHTML=
      `<div class="hg-head"><span>Stack health</span>`
      +`<b>${h.up}/${h.total}</b></div>`
      +`<div class="hg-spark">${spark}</div>`
      +`<div class="hg-word${bad?" bad":""}">${word}</div>`
      +`<div class="hg-sub">${when}${h.idle?` - ${h.idle} idle`:""}</div>`
      +(h.down&&h.down.length
        ? `<div class="hg-down">${h.down.join(", ")} down</div>` : "");
  }
  hgEl.classList.add("on");
  hgPlace();
}

async function pollContext(){
  try{
    const r=await fetch("/context",{cache:"no-store"});
    cgRender(await r.json());
  }catch(e){}
}

if(!AV.demo){
  setInterval(()=>pollLog("/activity",activityPanel,false),1000);
  setInterval(()=>pollLog("/transcript",transcriptPanel,true),1000);
  setInterval(renderActivity,250);
}
/* Outside the demo guard on purpose: the activity and transcript tails
   are real logs and would be meaningless in a demo, but the gauge reads
   an endpoint that answers with sample numbers under --mock -- so it
   belongs in demos and screenshots too. With no server at all the fetch
   just fails and the panel stays hidden. */
pollContext();
setInterval(pollContext,5000);
setInterval(cgPlace,1000);
ugRender();
setInterval(ugRender,5000);
addEventListener("resize",ugPlace);
hgRender();
setInterval(hgRender,2000);
addEventListener("resize",hgPlace);
/* core.js parks the thinking-sound toggle at the bottom-left edge, which
   the transcript panel also covers. Publish the inset so it can lift. */
function publishInset(){
  document.documentElement.style.setProperty(
    "--av-bottom-inset",chromeInset()+"px");
  /* And the top edge, for the same reason: core.js parks the NOW / TO DO
     lists in the top-right, and the activity strip runs the full width of
     the top. Its height changes with its content, so this is republished
     rather than measured once. */
  document.documentElement.style.setProperty(
    "--av-top-inset",(activityPanel.offsetHeight||0)+"px");
}
publishInset();
setInterval(publishInset,1000);
addEventListener("resize",publishInset);
addEventListener("resize",cgPlace);

if(SHOT){
  AV.shotRun(frame);
}else{
  let last=performance.now();
  (function loop(ts){
    const dt=Math.min(100,ts-last);last=ts;
    frame(dt);
    requestAnimationFrame(loop);
  })(performance.now());
}
</script>
